name: 代码体检（语法 / 静态契约 / 单测）

# 由来（v184 · 2026-10-02）：本地闸门一直靠人手跑 _p1/_gates.cjs，而它只跑得动
# 需要本机 Edge 的渲染态探针；仓库里「无需浏览器」的那部分（语法、静态契约、单测）
# 此前**没有任何自动哨兵**——改坏了要等下一次人工全跑才发现。
# 本工作流把这三类纯语义检查搬进 CI，让每次推送都有一道底线。
#
# ★ 明确**不**在 CI 里跑的东西，以及原因：
#   · 多数 tests/*.smoke.cjs 与 _p1/* 探针：需要本机 Edge + CDP，CI 上必红（假红比没有更坏）；
#     >>> 例外：tests/plot_merge.smoke.cjs（v185 起）是纯 Node 契约（无浏览器依赖），
#         scripts/check.cjs 会单独运行它；不会用 smoke 通配引入浏览器渲染用例。
#   · verify_*.js：按 .gitignore 排除，CI 上根本不存在（引用它 = 第一次推送就红）；
#   · _p1/_gates.cjs 里依赖 Edge 的 e2e/shot 项：同上。
#   这些留给本地全量批跑 `node _p1/_gates.cjs`（跑前先 `node _p1/_spawnprobe.cjs` 看 SPAWN_OK）。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本地与 CI 共用同一入口；使用 Git 可见文件集合，忽略本机诊断产物。
      - name: 语法、静态契约与 Node 测试
        run: node scripts/check.cjs
