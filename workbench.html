<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字农业工作台 · 地块全周期管理｜润野灌溉</title>
<link rel="stylesheet" href="runye-theme.css">
<style>
  :root{
    --g-50:#f0fdf4;--g-100:#dcfce7;--g-200:#bbf7d0;--g-500:#22c55e;--g-600:#16a34a;--g-700:#15803d;--g-800:#166534;--g-900:#14532d;
    --teal:#0d9488;--teal-700:#0f766e;
    --s-50:#f8fafc;--s-100:#f1f5f9;--s-200:#e2e8f0;--s-300:#cbd5e1;--s-400:#94a3b8;--s-500:#64748b;--s-600:#475569;--s-700:#334155;--s-800:#1e293b;
    --line:#e2e8f0;--radius:14px;--radius-sm:10px;--shadow:0 2px 8px rgba(15,23,42,.06);--shadow-md:0 6px 20px rgba(15,23,42,.10);
    --maxw:1280px;--font:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);color:var(--s-800);background:#f7f5f0;line-height:1.6;min-height:100vh;}
  a{text-decoration:none;color:inherit;}

  .wrap{max-width:none;margin:0;padding:0;}

  /* 顶部品牌栏 */
  .wb-header{background:#fff;position:sticky;top:0;z-index:200;box-shadow:var(--shadow);border-bottom:1px solid var(--s-100);}
  .wb-header-inner{max-width:none;margin:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .wb-brand{display:flex;align-items:center;gap:12px;}
  .wb-logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--g-700),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;}
  .wb-brand-name{font-size:17px;font-weight:800;color:var(--g-800);}
  .wb-brand-sub{font-size:11px;color:var(--s-500);letter-spacing:1px;}
  .wb-header-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .wb-header-links a{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--s-600);font-size:13px;font-weight:700;transition:all .2s;}
  .wb-header-links a:hover{border-color:var(--g-500);background:var(--g-50);color:var(--g-700);}

  /* 左右工作台布局 */
  .wb-shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start;max-width:1440px;margin:0 auto;padding:24px;}
  .wb-sidebar{position:sticky;top:88px;min-height:calc(100vh - 112px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .wb-side-kicker{font-size:11px;font-weight:800;color:var(--g-700);letter-spacing:.08em;margin:2px 2px 10px;}
  .wb-side-title{font-size:15px;font-weight:800;color:var(--s-800);margin:0 2px 14px;}
  .wb-nav{display:flex;flex-direction:column;gap:8px;}
  .wb-nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:14px;font-weight:700;color:var(--s-700);border:1px solid transparent;border-radius:10px;transition:all .2s;}
  .wb-nav a:hover{background:var(--g-50);border-color:var(--g-100);color:var(--g-700);}
  .wb-nav a.active{background:var(--g-600);border-color:var(--g-600);color:#fff;box-shadow:0 8px 18px rgba(22,163,74,.18);}
  .wb-nav a small{display:block;font-size:11px;font-weight:500;color:var(--s-500);line-height:1.35;margin-top:1px;}
  .wb-nav a.active small{color:rgba(255,255,255,.82);}
  .wb-nav-mark{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--s-100);color:var(--g-700);font-size:13px;font-weight:800;}
  .wb-nav a.active .wb-nav-mark{background:rgba(255,255,255,.2);color:#fff;}
  .wb-side-actions{display:grid;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .wb-side-actions a,.wb-side-actions button{width:100%;display:flex;align-items:center;justify-content:center;min-height:34px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--s-700);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;}
  .wb-side-actions a:hover,.wb-side-actions button:hover{border-color:var(--g-500);background:var(--g-50);color:var(--g-700);}
  .wb-main{min-width:0;background:transparent;}

  /* 通用区块标题 */
  .wb-section-title{font-size:16px;font-weight:800;color:var(--g-800);margin:26px 0 14px;padding-left:12px;border-left:4px solid var(--g-600);}
  .wb-muted{color:var(--s-500);font-size:13px;}
  .wb-sub{font-size:13px;color:var(--s-600);margin:-6px 0 14px;}

  /* 卡片网格 */
  .wb-grid{display:grid;gap:16px;}
  .wb-stats{grid-template-columns:repeat(4,1fr);}
  .wb-stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .wb-stat .label{font-size:13px;color:var(--s-500);margin-bottom:6px;}
  .wb-stat .value{font-size:26px;font-weight:800;color:var(--g-700);}
  .wb-stat .unit{font-size:13px;color:var(--s-500);font-weight:600;margin-left:4px;}

  /* 快捷操作 */
  .wb-quick{grid-template-columns:repeat(2,1fr);}
  .wb-quick .wb-stat{cursor:pointer;transition:all .2s;border-left:4px solid var(--teal);}
  .wb-quick .wb-stat:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .wb-quick .wb-stat .value{font-size:14px;color:var(--s-800);font-weight:700;}
  .wb-quick .wb-stat .sub{font-size:12px;color:var(--s-400);margin-top:3px;}
  /* 总览「查看完整详情」4 卡（空间/农事/周期/设置） */
  .wb-grid-actions .wb-stat .value{font-size:14px;color:var(--s-800);font-weight:700;}
  .wb-grid-actions .wb-stat .sub{font-size:12px;color:var(--s-400);margin-top:3px;}

  /* 待办 / 最近地块 */
  .wb-two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .wb-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .wb-panel h3{font-size:14px;font-weight:700;color:var(--g-800);margin-bottom:12px;}
  .wb-todo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;}
  .wb-todo .t-name{font-weight:600;color:var(--s-800);flex:1;}
  .wb-todo .t-meta{color:var(--s-500);font-size:12px;white-space:nowrap;}
  .wb-todo .t-btn{padding:4px 10px;font-size:12px;border:1px solid var(--g-600);color:var(--g-700);border-radius:8px;background:#fff;cursor:pointer;white-space:nowrap;}
  .wb-todo .t-btn:hover{background:var(--g-50);}
  .wb-empty{color:var(--s-400);font-size:13px;padding:14px 0;text-align:center;}

  /* 地块列表 */
  .wb-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .wb-toolbar input,.wb-toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;color:var(--s-800);background:#fff;}
  .wb-toolbar input[type=search]{flex:1;min-width:200px;}
  .wb-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--s-700);transition:all .2s;font-family:inherit;}
  .wb-btn-primary{background:var(--g-600);color:#fff;border-color:var(--g-600);}
  .wb-btn-primary:hover{background:var(--g-700);}
  .wb-btn-light{background:#fff;color:var(--g-700);border-color:var(--g-600);}
  .wb-btn-light:hover{background:var(--g-50);}
  .wb-btn-danger{background:#fff;color:#c2410c;border-color:#c2410c;}
  .wb-btn-danger:hover{background:#fff7ed;}

  .wb-land-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .wb-land-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;}
  .wb-land-card.link:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--g-500);}
  .wb-land-card .lc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .wb-land-card .lc-name{font-size:16px;font-weight:800;color:var(--g-800);}
  .wb-land-card .lc-code{font-size:11px;color:var(--s-400);}
  .wb-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .st-planting{background:var(--g-50);color:var(--g-700);}
  .st-fallow{background:#fff7ed;color:#c2410c;}
  .st-wait{background:var(--s-100);color:var(--s-600);}
  .wb-land-card .lc-row{font-size:13px;color:var(--s-600);margin:3px 0;display:flex;justify-content:space-between;}
  .wb-land-card .lc-row b{color:var(--s-800);font-weight:600;}

  /* 详情骨架 */
  .wb-detail-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
  .wb-detail-tabs button{padding:10px 16px;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--s-600);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
  .wb-detail-tabs button:hover{color:var(--g-700);}
  .wb-detail-tabs button.active{color:var(--g-700);border-bottom-color:var(--g-600);}
  .wb-tab-panel{display:none;}
  .wb-tab-panel.active{display:block;}
  .wb-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--g-700);font-weight:600;cursor:pointer;background:none;border:none;font-size:14px;font-family:inherit;}
  .wb-back:hover{text-decoration:underline;}

  /* 决策卡 */
  .wb-decision{background:linear-gradient(135deg,#f0fdf4,#ecfeff);border:1px solid var(--g-200);border-radius:14px;padding:16px 18px;margin:14px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:center;}
  .wb-decision .dc-block{min-width:120px;}
  .wb-decision .dc-label{font-size:12px;color:var(--s-500);margin-bottom:2px;}
  .wb-decision .dc-phase{font-size:15px;font-weight:800;color:var(--g-700);}
  .wb-decision .dc-ops{font-size:13px;color:var(--s-700);max-width:520px;line-height:1.5;}
  .wb-decision .dc-warn{color:#c2410c;font-weight:700;font-size:14px;}
  .wb-decision .dc-hint{font-size:11px;color:var(--s-400);width:100%;margin-top:2px;}

  /* 表单 / 弹窗 */
  .wb-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;}
  .wb-modal{background:#fff;border-radius:14px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .wb-modal h3{font-size:17px;font-weight:800;color:var(--g-800);margin-bottom:16px;}
  .wb-field{margin-bottom:12px;}
  .wb-field label{display:block;font-size:13px;color:var(--s-600);margin-bottom:4px;font-weight:600;}
  .wb-field input,.wb-field select,.wb-field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;color:var(--s-800);background:#fff;}
  .wb-field-row{display:flex;gap:10px;}
  .wb-field-row .wb-field{flex:1;}
  .wb-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .wb-form-note{font-size:12px;color:var(--s-400);margin-top:4px;}

  /* 农事记录列表 */
  .wb-rec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .wb-rec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
  .wb-rec-type{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .rt-施肥{background:#ecfdf5;color:#047857;}
  .rt-用药{background:#fef2f2;color:#b91c1c;}
  .rt-灌溉{background:#eff6ff;color:#1d4ed8;}
  .rt-耕作{background:#fff7ed;color:#c2410c;}
  .rt-采收{background:#faf5ff;color:#7e22ce;}
  .rt-长势{background:#f0fdf4;color:#15803d;}
  .wb-rec-meta{font-size:13px;color:var(--s-600);}
  .wb-rec-meta b{color:var(--s-800);}
  .wb-rec-remark{font-size:12px;color:var(--s-500);margin-top:4px;}
  .wb-rec-del{font-size:12px;color:#c2410c;cursor:pointer;border:none;background:none;}

  /* 时间轴 */
  .wb-tl{position:relative;padding-left:22px;margin-top:6px;}
  .wb-tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .wb-tl-item{position:relative;margin-bottom:14px;}
  .wb-tl-item::before{content:'';position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--g-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--g-200);}
  .wb-tl-date{font-size:12px;color:var(--s-500);}
  .wb-tl-title{font-size:14px;font-weight:700;color:var(--s-800);margin:1px 0 2px;}

  /* 成本 */
  .wb-cost-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .wb-cost{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;text-align:center;}
  .wb-cost .c-label{font-size:12px;color:var(--s-500);}
  .wb-cost .c-val{font-size:20px;font-weight:800;color:var(--g-700);margin-top:2px;}

  /* 报表表 */
  .wb-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;}
  .wb-ops-table{min-width:1120px;table-layout:fixed;}
  .wb-ops-table col:nth-child(1){width:170px;}
  .wb-ops-table col:nth-child(2){width:92px;}
  .wb-ops-table col:nth-child(3){width:185px;}
  .wb-ops-table col:nth-child(4){width:95px;}
  .wb-ops-table col:nth-child(6){width:112px;}
  .wb-ops-table td:first-child a{display:block;max-width:145px;line-height:1.45;}
  .wb-ops-table td:nth-child(3),.wb-ops-table td:nth-child(5){line-height:1.6;}
  .wb-table th,.wb-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;}
  .wb-table th{background:var(--s-50);color:var(--s-700);font-weight:700;}
  .wb-table tr:hover td{background:var(--g-50);}

  /* 灌溉方案列表 */
  .wb-irr{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .wb-irr .ii-name{font-weight:700;color:var(--g-800);}
  .wb-irr .ii-meta{font-size:12px;color:var(--s-500);margin-top:2px;}

  .wb-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}

  @media(max-width:980px){
    .wb-shell{grid-template-columns:1fr;padding:14px;gap:14px;}
    .wb-sidebar{position:static;min-height:0;padding:12px;}
    .wb-side-kicker,.wb-side-title{display:none;}
    .wb-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
    .wb-nav a{justify-content:center;padding:10px 8px;text-align:center;}
    .wb-nav a small{display:none;}
    .wb-side-actions{display:flex;flex-wrap:wrap;margin-top:10px;padding-top:10px;}
    .wb-side-actions a,.wb-side-actions button{width:auto;flex:1 1 120px;}
    .wb-stats{grid-template-columns:repeat(2,1fr);}
    .wb-quick{grid-template-columns:1fr;}
    .wb-two-col{grid-template-columns:1fr;}
  }
  @media(max-width:640px){
    .wb-stats{grid-template-columns:1fr;}
    .wb-header-inner{height:auto;min-height:62px;padding:10px 14px;align-items:flex-start;gap:10px;flex-direction:column;}
    .wb-header-links{width:100%;}
    .wb-header-links a{flex:1;}
    .wb-nav{grid-template-columns:1fr;}
    .wb-nav a{justify-content:flex-start;text-align:left;}
    .wb-field-row{flex-direction:column;gap:0;}
  }
  /* 每日行情数据面板 */
  .wb-daily-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:4px;}
  .wb-dcard{background:#fff;border:1px solid var(--b-200,#e9efe9);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .wb-dcard-h{font-size:14px;font-weight:600;color:var(--g-700,#2e7d52);padding:10px 14px;background:linear-gradient(180deg,#f2faf4,#fff);border-bottom:1px solid #eef2ee;}
  .wb-dcard-b{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 8px;padding:14px;}
  .wb-dv{text-align:center;font-size:21px;font-weight:700;color:var(--g-800,#1f3d2b);line-height:1.1;}
  .wb-dv span{display:block;font-size:11px;font-weight:500;color:var(--s-400,#8aa0a0);margin-top:4px;}
  .wb-dnote{font-size:12.5px;color:#445;line-height:1.65;margin-top:8px;}
  .wb-dnote b{color:var(--g-700,#2e7d52);}
  .wb-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-bottom:1px dashed #eef2ee;}
  .wb-price:last-child{border-bottom:none;}
  .wb-pname{font-size:13px;font-weight:600;color:#333;min-width:64px;}
  .wb-pval{font-size:15px;font-weight:700;color:var(--g-700,#2e7d52);}
  .wb-ptrend{font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;}
  .wb-ptrend.up{color:#c0392b;background:#fdecea;}
  .wb-ptrend.down{color:#1e8a4c;background:#e8f7ee;}
  .wb-pmeta{width:100%;font-size:11px;color:var(--s-400,#8aa0a0);}
  .wb-mkt{margin:6px 0 2px;padding-top:6px;border-top:1px dashed #eef2ee;}
  .wb-mkt-row{display:flex;align-items:baseline;gap:6px;padding:2px 0;font-size:12px;}
  .wb-more{font-size:12px;font-weight:600;color:var(--g-600,#16a34a);text-decoration:none;margin-left:8px;white-space:nowrap;}
  .wb-more:hover{text-decoration:underline;}
  .wb-mkt-m{color:#334;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wb-mkt-p{color:var(--g-700,#2e7d52);font-weight:600;white-space:nowrap;}
  .wb-mkt-d{color:var(--s-400,#8aa0a0);font-size:10.5px;white-space:nowrap;}
  .wb-ptrend.sm{font-size:10.5px;padding:0 4px;}
  .wb-news{display:flex;flex-direction:column;max-height:340px;overflow:auto;padding:4px 12px 8px;}
  .wb-news-region{padding:6px 0 2px;border-bottom:1px dashed #eef1ee;}
  .wb-news-region:last-child{border-bottom:none;}
  .wb-news-rh{font-size:12px;font-weight:700;color:var(--g-700,#2e7d52);margin:2px 0 4px;letter-spacing:.5px;}
  .wb-news-empty{font-size:11px;color:var(--s-400,#8aa0a0);padding:1px 0 6px;}
  .wb-news-item{display:block;padding:7px 0;border-bottom:1px solid #f4f6f4;text-decoration:none;color:#333;}
  .wb-news-item:last-child{border-bottom:none;}
  .wb-news-item:hover .wb-nt{color:var(--g-700,#2e7d52);}
  .wb-nt{display:block;font-size:13px;line-height:1.5;color:#222;}
  .wb-nm{display:block;font-size:11px;color:var(--s-400,#8aa0a0);margin-top:3px;}
  @media(max-width:1100px){.wb-daily-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.wb-daily-grid{grid-template-columns:1fr;}}

  /* 控制台统一视觉层级 */
  :root{
    --radius:8px;
    --radius-sm:6px;
    --shadow:none;
    --shadow-md:0 1px 3px rgba(15,23,42,.12);
  }
  body{
    background:#f5f7f5;
    font-size:14px;
    line-height:1.5;
  }
  .wb-header{
    box-shadow:0 1px 2px rgba(15,23,42,.06);
    border-bottom:1px solid var(--line);
  }
  .wb-header-inner{
    height:58px;
    padding:0 22px;
  }
  .wb-logo{
    width:34px;
    height:34px;
    font-size:15px;
  }
  .wb-brand{
    gap:10px;
  }
  .wb-brand-name{
    font-size:16px;
    line-height:1.25;
  }

<script>
/* ============================================================
   数据层（runye_db_v1）—— 统一基于 localStorage
   核心：land_id 为主键，工作台只管理地块档案、农事记录、物资与待办；灌溉设计工具保持独立。
   ============================================================ */
var DB_KEY='runye_db_v1';
var DB_VERSION=1;

function dbLoad(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(!raw) return null;
    var obj=JSON.parse(raw);
    if(!obj || obj.version!==DB_VERSION){ return migrate(obj); }
    return obj;
  }catch(e){ return null; }
}
function dbSave(obj){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(obj||DB)); }catch(e){ console.error('dbSave failed', e); }
}
function migrate(old){
  var fresh=dbInit();
  if(old && old.lands) fresh.lands=old.lands;
  if(old && old.records) fresh.records=old.records;
  if(old && old.irrigation_projects) fresh.irrigation_projects=old.irrigation_projects;
  if(old && old.materials) fresh.materials=old.materials;
  if(old && old.tasks) fresh.tasks=old.tasks;
  if(old && old.crop_plans) fresh.crop_plans=old.crop_plans;
  return fresh;
}
function dbInit(){
  return {
    version:DB_VERSION,
    lands:[],          // 地块主表
    records:[],        // 农事记录（施肥/用药/灌溉/耕作/采收/长势）
    irrigation_projects:[], // 历史兼容字段：工作台不再展示或打开灌溉设计工具
    materials:[],      // 物资字典
    tasks:[],          // 农事待办
    crop_plans:[]      // 后续可扩展的作物方案配置
  };
}
var DB=dbLoad()||dbInit();
dbSave(DB);

/* ---------- 主键生成 ---------- */
function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 空间边界兼容 ---------- */
function normalizeGeo(raw){
  if(!raw) return null;
  var g=raw.geo_json||raw.geo||raw;
  var poly=Array.isArray(g.poly)?g.poly:(Array.isArray(raw.poly)?raw.poly:[]);
  if(!poly || poly.length<3) return null;
  var sqm=parseFloat(g.sqm!=null?g.sqm:raw.sqm)||0;
  var mu=parseFloat(g.mu!=null?g.mu:raw.mu)||0;
  if(!mu && sqm) mu=sqm/666.67;
  if(!sqm && mu) sqm=mu*666.67;
  return {source:g.source||raw.source||'runye-irrigation',plotId:g.plotId||raw.id||raw.plotId||'',poly:poly,sqm:sqm,mu:mu,saved_at:g.saved_at||raw.ts||Date.now()};
}
function landGeo(land){ return normalizeGeo(land); }
function hasLandGeo(land){ var g=landGeo(land); return !!(g&&g.poly&&g.poly.length>=3); }
function landAreaMu(land){ var g=landGeo(land); return (g&&parseFloat(g.mu)) || parseFloat((land||{}).area) || 0; }
function samePlotName(a,b){ return String(a||'').trim() && String(a||'').trim()===String(b||'').trim(); }
function syncLegacyPlotGeo(){
  try{
    var plots=JSON.parse(localStorage.getItem('runye_plot_library')||'[]');
    if(!Array.isArray(plots)||!plots.length) return 0;
    var changed=0;
    getLands().forEach(function(l){
      if(hasLandGeo(l)) return;
      var match=plots.filter(function(p){ return l.legacy_id&&p.id===l.legacy_id; })[0];
      if(!match) match=plots.filter(function(p){ return samePlotName(p.name,l.name); })[0];
      if(!match){
        match=plots.filter(function(p){
          var la=parseFloat(l.area)||0, pa=parseFloat(p.mu)||0;
          return la>0&&pa>0&&Math.abs(la-pa)<=Math.max(0.05, la*0.003);
        })[0];
      }
      var g=normalizeGeo(match);
      if(g){
        l.geo_json=g;
        l.legacy_id=l.legacy_id||match.id;
        if(g.mu) l.area=Math.round(g.mu*100)/100;
        changed++;
      }
    });
    if(changed) dbSave(DB);
    return changed;
  }catch(e){ return 0; }
}

/* ---------- 地块 CRUD ---------- */
function getLands(){ return DB.lands||[]; }
function getLand(id){ return getLands().filter(function(l){return l.land_id===id;})[0]||null; }
function addLand(data){
  var land={
    land_id: data.land_id||uid('land'),
    name: data.name||'未命名地块',
    code: data.code||'',
    area: data.area||0,
    geo_json: data.geo_json||null,
    crop: data.crop||'',
    variety: data.variety||'',
    soil_type: data.soil_type||'',
    planting_location: data.planting_location||data.farm||'',
    plant_date: data.plant_date||data.planting_date||'',
    harvest_date: data.harvest_date||'',
    base_fertilizer: data.base_fertilizer||'',
    planting_method: data.planting_method||'',
    status: data.status||'wait',   // wait / planting / fallow
    farm: data.farm||data.planting_location||'',
    create_time: data.create_time||new Date().toISOString(),
    remark: data.remark||''
  };
  DB.lands.push(land); dbSave(DB);
  return land;
}
function updateLand(id, patch){
  var l=getLand(id); if(!l) return null;
  for(var k in patch){ if(patch.hasOwnProperty(k)) l[k]=patch[k]; }
  dbSave(DB); return l;
}
function deleteLand(id){
  DB.lands=DB.lands.filter(function(l){return l.land_id!==id;});
  DB.records=DB.records.filter(function(r){return r.land_id!==id;});
  DB.irrigation_projects=DB.irrigation_projects.filter(function(p){return p.land_id!==id;});
  dbSave(DB);
}

/* ---------- 兼容：把现有 runye_plot_library 地块导入为 land（一次性引导） ---------- */
function importLegacyPlots(){
  try{
    var v=JSON.parse(localStorage.getItem('runye_plot_library')||'null');
    if(!v||!Array.isArray(v)||!v.length) return 0;
    var n=0;
    v.forEach(function(p){
      if(getLands().filter(function(l){return l.legacy_id===p.id;}).length) return;
      addLand({
        legacy_id:p.id,
        name:p.name||'导入地块',
        code:p.code||'',
        area:p.mu||0,
        geo_json:normalizeGeo(p),
        crop:p.crop||'',
        plant_date:p.plantingDate||'',
        status:p.plantingDate? 'planting':'wait',
        farm:p.farm||'',
        remark:'由旧地块库导入'
      });
      n++;
    });
    return n;
  }catch(e){ return 0; }
}

/* ---------- 农事记录 CRUD ---------- */
function getRecords(landId){
  var all=DB.records||[];
  if(landId){ return all.filter(function(r){return r.land_id===landId;}); }
  return all;
}
function addRecord(data){
  var rec={
    record_id: data.record_id||uid('rec'),
    land_id: data.land_id||'',
    record_type: data.record_type||'施肥',
    operate_date: data.operate_date||new Date().toISOString().slice(0,10),
    material_name: data.material_name||'',
    dosage: data.dosage||'',
    method: data.method||'',
    operator: data.operator||'',
    interval_days: data.interval_days||'',
    actual_cost: data.actual_cost||'',
    work_hours: data.work_hours||'',
    labor_cost: data.labor_cost||'',
    yield_qty: data.yield_qty||'',
    yield_unit: data.yield_unit||'',
    sale_amount: data.sale_amount||'',
    remark: data.remark||'',
    create_time: new Date().toISOString()
  };
  DB.records.push(rec); dbSave(DB);
  return rec;
}
function deleteRecord(id){
  DB.records=DB.records.filter(function(r){return r.record_id!==id;});
  dbSave(DB);
}

/* ---------- 物资字典 CRUD ---------- */
function getMaterials(){ return DB.materials||[]; }
function addMaterial(data){
  var m={
    material_id: data.material_id||uid('mat'),
    name:data.name||'',
    category:data.category||'肥料',
    spec:data.spec||'',
    unit:data.unit||'',
    stock_qty: data.stock_qty||'',
    safe_stock: data.safe_stock||'',
    unit_price: data.unit_price||'',
    supplier: data.supplier||'',
    batch_no: data.batch_no||'',
    expiry_date: data.expiry_date||'',
    interval_days: data.interval_days||'',
    recommend_dosage: data.recommend_dosage||''
  };
  DB.materials.push(m); dbSave(DB); return m;
}
function deleteMaterial(id){
  DB.materials=DB.materials.filter(function(m){return m.material_id!==id;});
  dbSave(DB);
}

/* ---------- 灌溉方案 CRUD ---------- */
function getIrrigation(landId){
  return (DB.irrigation_projects||[]).filter(function(p){return p.land_id===landId;});
}
function addIrrigation(data){
  var p={ proj_id: data.proj_id||uid('irr'), land_id:data.land_id||'', name:data.name||'灌溉方案', summary:data.summary||'', plan_json:data.plan_json||null, create_time:new Date().toISOString() };
  DB.irrigation_projects.push(p); dbSave(DB); return p;
}

/* ---------- 农事待办 CRUD ---------- */
function getTasks(){ return DB.tasks||[]; }
function addTask(data){
  var t={
    task_id: data.task_id||uid('task'),
    land_id:data.land_id||'',
    title:data.title||'待办',
    due_date:data.due_date||'',
    done:!!data.done,
    priority:data.priority||'中',
    plan_source:data.plan_source||'manual',
    stage:data.stage||'',
    area:data.area||'',
    crop:data.crop||'',
    operator_team:data.operator_team||'',
    create_time:data.create_time||new Date().toISOString()
  };
  DB.tasks.push(t); dbSave(DB); return t;
}
function toggleTask(id){
  var t=getTasks().filter(function(x){return x.task_id===id;})[0];
  if(t){ t.done=!t.done; dbSave(DB); }
}

/* ============================================================
   工具函数
   ============================================================ */
var STATUS_LABEL={wait:'待播种',planting:'种植中',fallow:'休耕'};
var RECORD_TYPES=['施肥','用药','灌溉','耕作','采收','长势'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function todayISO(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'}); }
function fmtNum(n){ var v=parseFloat(n); return isNaN(v)?'0':(v%1===0?v.toFixed(0):v.toFixed(2)); }
function dosageParts(raw){
  var s=String(raw||'').trim();
  if(!s) return null;
  var m=s.match(/[-+]?\d+(?:\.\d+)?/);
  if(!m) return {amount:null,unit:'文字',raw:s};
  var amount=parseFloat(m[0]);
  var unit=s.slice(m.index+m[0].length).trim();
  unit=unit.replace(/^\s*(kg|公斤|千克)\s*\/\s*亩.*/i,'kg/亩')
           .replace(/^\s*(g|克)\s*\/\s*亩.*/i,'g/亩')
           .replace(/^\s*(ml|毫升)\s*\/\s*亩.*/i,'ml/亩')
           .replace(/^\s*(l|升)\s*\/\s*亩.*/i,'L/亩')
           .replace(/^\s*(m3|m³|方|立方米)\s*\/\s*亩.*/i,'m³/亩')
           .replace(/^\s*(m3|m³|方|立方米).*/i,'m³')
           .replace(/^\s*(kg|公斤|千克).*/i,'kg')
           .replace(/^\s*(g|克).*/i,'g')
           .replace(/^\s*(ml|毫升).*/i,'ml')
           .replace(/^\s*(l|升).*/i,'L');
  if(!unit) unit='未注明单位';
  return {amount:amount,unit:unit,raw:s};
}
function addDosageUsage(bucket, type, raw){
  var p=dosageParts(raw);
  if(!p) return;
  bucket[type]=bucket[type]||{};
  if(p.amount==null){
    bucket[type]._text=(bucket[type]._text||0)+1;
    return;
  }
  bucket[type][p.unit]=(bucket[type][p.unit]||0)+p.amount;
}
function formatUsage(bucket){
  if(!bucket) return '';
  var parts=[];
  Object.keys(bucket).sort().forEach(function(unit){
    if(unit==='_text') return;
    parts.push(fmtNum(bucket[unit])+' '+unit);
  });
  if(bucket._text) parts.push(bucket._text+' 条文字用量');
  return parts.join(' / ');
}
function addDaysISO(iso, days){
  var d=new Date(iso+'T00:00:00+08:00');
  d.setDate(d.getDate()+days);
  return d.toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
}
function materialByName(name){
  return getMaterials().filter(function(m){return m.name===name;})[0]||null;
}
function recordActualCost(rec){
  return (parseFloat((rec||{}).actual_cost)||0)+(parseFloat((rec||{}).labor_cost)||0);
}
function estimateRecordCost(rec, land){
  var actual=recordActualCost(rec);
  if(actual>0) return actual;
  var m=materialByName(rec.material_name||'');
  if(!m || !parseFloat(m.unit_price)) return 0;
  var p=dosageParts(rec.dosage||'');
  if(!p || p.amount==null) return 0;
  var qty=p.amount;
  if(/\/亩/.test(p.unit||rec.dosage||'')) qty*=landAreaMu(land);
  return qty*parseFloat(m.unit_price);
}
function recordRevenue(rec){ return parseFloat((rec||{}).sale_amount)||0; }

/* ---------- 多作物方案引擎 ---------- */
var QICAI_NODES = window.QICAI_NODES || [];

  {dayMin:0,dayMax:7,stage:'定植缓苗期',op:'小水勤灌 / 巡田',count:'水肥与成活率',list:'生根类水溶肥 1 kg/亩；钙镁肥 1 kg/亩；重点查缺苗、萎蔫、滴头堵塞',mix:'滴灌少量多次，避免大水漫灌；弱苗区单独标记。'},

function enrichPlanNodes(nodes){
  return (nodes||[]).map(function(n,i){
    var o={}; Object.keys(n).forEach(function(k){o[k]=n[k];});
    o.nd=o.nd||i+1; o.count=o.count||''; o.stage=o.stage||o.dayText||'—'; o.list=o.list||o.listText||''; o.mix=o.mix||''; return o;
  });
}
function cropPlanFor(crop){
  var c=String(crop||'').toLowerCase();
  if(/七彩|花生|peanut/.test(c)){return {key:'qicai_peanut',name:'七彩花生全程植保方案',nodes:QICAI_NODES,detail:true,cropKeys:['七彩','花生','peanut']};}
  if(/番茄|西红柿|tomato/.test(c)){return {key:'tomato',name:'番茄规模化水肥植保方案',nodes:enrichPlanNodes(TOMATO_NODES),detail:false,cropKeys:['番茄','西红柿','tomato']};}
  if(/辣椒|pepper|chili/.test(c)){return {key:'pepper',name:'辣椒规模化水肥植保方案',nodes:enrichPlanNodes(PEPPER_NODES),detail:false,cropKeys:['辣椒','pepper','chili']};}
  // 用户导入的自定义方案：按作物关键词匹配
  var customs=DB.crop_plans||[];
  for(var i=0;i<customs.length;i++){
    var keys=customs[i].cropKeys||[];
    var hit=keys.some(function(k){ var kk=String(k||'').toLowerCase(); return kk && (c.indexOf(kk)>=0 || kk.indexOf(c)>=0); });
    if(hit){ return {key:customs[i].key,name:customs[i].name,nodes:enrichPlanNodes(customs[i].nodes),detail:!!customs[i].detail,cropKeys:keys}; }
  }
  return {key:'general',name:'通用作物巡田方案',nodes:enrichPlanNodes(GENERAL_NODES),detail:false,cropKeys:[]};
}
function fallbackPlanLookup(days, nodes){
  var active=null, prev=null, next=null;
  for(var i=0;i<(nodes||[]).length;i++){
    var node=nodes[i];
    if(days>=node.dayMin && days<=node.dayMax && !active){ active=node; }
    if(node.dayMax<days){ prev=node; }
    if(node.dayMin>days && !next){ next=node; }
  }
  return {active:active, prev:prev, next:next, display:active||next||prev, gap:!active};
}
function computeStage(plantDate, crop){
  var plan=cropPlanFor(crop);
  if(!plantDate){ return {warn:'未设置种植/播种日期，无法推算当前阶段。请到「设置 → 编辑地块」补全日期。', days:null, nd:null, stage:'—', op:'', count:'', list:'', mix:'', planName:plan.name, planKey:plan.key}; }
  if(!plan.nodes.length){ return {warn:'植保方案数据未加载，请检查 qicai-huasheng/schedule-core.js。', days:null, nd:null, stage:'—', op:'', count:'', list:'', mix:'', planName:plan.name, planKey:plan.key}; }
  var p=new Date(plantDate+'T00:00:00+08:00'); var t=new Date(todayISO()+'T00:00:00+08:00');
  var days=Math.floor((t-p)/86400000);
  if(days<0){ return {warn:'尚未到种植/播种日期（距日期还有 '+(-days)+' 天）', days:days, nd:null, stage:'播前准备', op:'', count:'', list:'', mix:'', planName:plan.name, planKey:plan.key}; }
  var found = (plan.key==='qicai_peanut' && window.QICAI_findPlanNode) ? window.QICAI_findPlanNode(days) : fallbackPlanLookup(days, plan.nodes);
  var cur = found.display || plan.nodes[0];
  var next = found.next;
  var nextLine = next ? ('距「'+next.stage+'」还有 '+Math.max(0,next.dayMin-days)+' 天') : '已完成全部预设节点';
  var gapNote = found.gap ? ('当前第 '+days+' 天不在固定作业窗口内，以下显示'+(next?'下一节点':'最近节点')+'准备参考，不建议机械照搬上一节点重复用药。') : '';
  if(!plan.detail) gapNote += (gapNote?' ':'')+'当前为规模化通用模板，请按当地农技意见和产品标签校准具体用量。';
  return {warn:null,gap:found.gap,gapNote:gapNote,days:days,nd:cur.nd,stage:cur.stage,op:cur.op,count:cur.count,list:cur.list,mix:cur.mix,nextStage:next?next.stage:'—',nextDays:next?(next.dayMin-days):null,nextLine:nextLine,planName:plan.name,planKey:plan.key};
}
function stagePlanForLand(land){
  if(!land || !land.plant_date) return null;
  var s=computeStage(land.plant_date, land.crop);
  if(s.warn || s.days==null || !s.stage) return null;
  var dueIn = s.gap ? (s.nextDays==null?999:Math.max(0,s.nextDays)) : 0;
  return {land:land, stage:s.stage, nd:s.nd, op:s.op, list:s.list, mix:s.mix, dueIn:dueIn, dueDate:addDaysISO(todayISO(),dueIn), active:!s.gap, planName:s.planName, planKey:s.planKey};
}
function plannedTaskExists(landId, title, dueDate){
  return getTasks().some(function(t){ return !t.done && t.land_id===landId && t.title===title && t.due_date===dueDate; });
}
function scalePlanItems(daysAhead){
  daysAhead=daysAhead==null?3:daysAhead;
  return getLands().filter(function(l){return l.status==='planting';}).map(stagePlanForLand).filter(function(p){return p && p.dueIn<=daysAhead;}).sort(function(a,b){return a.dueIn-b.dueIn;});
}
function generateScaleTasks(daysAhead){
  var items=scalePlanItems(daysAhead==null?3:daysAhead), made=0;
  items.forEach(function(p){
    var title='作业：'+p.stage;
    if(plannedTaskExists(p.land.land_id,title,p.dueDate)) return;
    addTask({land_id:p.land.land_id,title:title,due_date:p.dueDate,priority:p.active?'高':'中',plan_source:p.planKey||'crop_plan',stage:p.stage,area:landAreaMu(p.land),crop:p.land.crop||'',operator_team:''});
    made++;
  });
  alert(made?('已生成 '+made+' 条未来 '+(daysAhead||3)+' 天作业待办'):'没有新的可生成作业，或待办已存在');
  router();
}
function planMaterials(plan){
  var txt=String((plan&&plan.list)||'');
  return txt.split(/[+｜|，,；;。\n]/).map(function(seg){
    seg=seg.replace(/^(杀虫|杀菌|控旺|营养|灌根|叶面|菌剂|补钙|水肥|肥料|农药)[:：]\s*/,'').trim();
    var m=seg.match(/^(.+)\s+([0-9]+(?:\.\d+)?)(?:\s*[-~–—至]\s*([0-9]+(?:\.\d+)?))?\s*(kg|公斤|千克|g|克|ml|毫升|L|升|m3|m³|方|立方米)(?:\s*\/\s*亩)?/i);
    if(!m) return null;
    var amount=parseFloat(m[3]||m[2]);
    var unit=dosageParts(amount+' '+m[4]+'/亩').unit;
    var name=m[1].trim();
    if(!name || /查|记录|统计|决定|评估|避免|加强/.test(name)) return null;
    return {name:name, amount:amount, unit:unit, dosage:amount+' '+unit};
  }).filter(Boolean);
}
function aggregatePlanDemand(daysAhead){
  var out={}, items=scalePlanItems(daysAhead==null?15:daysAhead);
  items.forEach(function(p){
    planMaterials(p).forEach(function(pm){
      var key=pm.name+'__'+pm.unit;
      if(!out[key]) out[key]={name:pm.name,unit:pm.unit,qty:0,lands:0,area:0,cost:0,material:materialByName(pm.name)};
      var area=landAreaMu(p.land), qty=pm.amount*area;
      out[key].qty+=qty; out[key].area+=area; out[key].lands+=1;
      if(out[key].material && parseFloat(out[key].material.unit_price)) out[key].cost+=qty*parseFloat(out[key].material.unit_price);
    });
  });
  return Object.keys(out).map(function(k){return out[k];}).sort(function(a,b){return b.qty-a.qty;});
}

function wbModal(innerHtml, onMount){
  closeModal();
  var ov=document.createElement('div'); ov.className='wb-overlay'; ov.id='wbOverlay';
  ov.innerHTML='<div class="wb-modal">'+innerHtml+'</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){ if(e.target===ov) closeModal(); });
  if(onMount) onMount(ov);
}
function closeModal(){ var o=document.getElementById('wbOverlay'); if(o) o.parentNode.removeChild(o); }

function field(label, inputHtml){
  return '<div class="wb-field"><label>'+esc(label)+'</label>'+inputHtml+'</div>';
}
function optionList(arr, sel){ return arr.map(function(o){return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>';}).join(''); }

function setActiveNav(route){
  var links=document.querySelectorAll('#wbNav a');
  links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-route')===route); });
}
function router(){
  var hash=location.hash.replace(/^#\/?/,'');
  var main=document.getElementById('wbMain');
  if(hash.indexOf('land/')===0){
    setActiveNav('lands');
    renderLandDetail(main, hash.slice(5));
    return;
  }
  if(hash==='home'){ location.hash='#/dashboard'; return; }
  if(hash==='dashboard'){ setActiveNav('dashboard'); renderDashboard(main); return; }
  if(hash==='lands'){ setActiveNav('lands'); renderLands(main); return; }
  if(hash==='dispatch'){ setActiveNav('dispatch'); renderDispatch(main); return; }
  if(hash==='purchase'){ setActiveNav('purchase'); renderPurchase(main); return; }
  if(hash==='reports'){ setActiveNav('reports'); renderReports(main); return; }
  setActiveNav('dashboard'); renderDashboard(main);
}

function dashboardRisks(lands, mats, tasks){
  var risks=[];
  lands.forEach(function(l){
    if(l.status==='planting'&&!l.plant_date) risks.push({title:l.name+' 缺种植/播种日期',meta:'会导致作物节点、统防调度和采购测算失效',level:'danger'});
    if(l.status==='planting'&&!hasLandGeo(l)) risks.push({title:l.name+' 缺空间边界',meta:'无法精确关联灌溉设计和实测面积',level:'warn'});
  });
  mats.forEach(function(m){
    var stock=parseFloat(m.stock_qty)||0, safe=parseFloat(m.safe_stock)||0;
    if(safe>0&&stock<safe) risks.push({title:m.name+' 库存低于安全库存',meta:'当前 '+stock+(m.unit||'')+'，安全 '+safe+(m.unit||''),level:'danger'});
    if(m.expiry_date){
      var left=Math.floor((new Date(m.expiry_date+'T00:00:00+08:00')-new Date(todayISO()+'T00:00:00+08:00'))/86400000);
      if(left<=30) risks.push({title:m.name+' 临近有效期',meta:'有效期 '+m.expiry_date+'，剩余 '+left+' 天',level:left<0?'danger':'warn'});
    }
    if(m.name&&!parseFloat(m.unit_price)) risks.push({title:m.name+' 缺单价',meta:'会影响采购金额和亩均成本估算',level:'warn'});
  });
  tasks.forEach(function(t){
    if(!t.done&&t.due_date&&t.due_date<todayISO()) risks.push({title:t.title+' 已逾期',meta:'到期 '+t.due_date+'，请处理待办闭环',level:'danger'});
  });
  return risks;
}

        '<option value="planting">种植中</option>'+
        '<option value="fallow">休耕</option>'+
      '</select>'+
      '<select id="wbCropFilter" onchange="filterLands()"><option value="">全部作物</option>'+cropOptions()+'</select>'+

    '</div>'+

  filterLands();

function cropOptions(){
  var crops={};
  getLands().forEach(function(l){ if(l.crop) crops[l.crop]=1; });
  return Object.keys(crops).map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
}
function filterLands(){
  var kw=(document.getElementById('wbSearch').value||'').trim().toLowerCase();
  var st=document.getElementById('wbStatusFilter').value||'';
  var cr=document.getElementById('wbCropFilter').value||'';
  var list=getLands().filter(function(l){
    if(st && l.status!==st) return false;
    if(cr && l.crop!==cr) return false;
    if(kw){
      var hay=(l.name+' '+(l.code||'')+' '+(l.crop||'')).toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
  var grid=document.getElementById('wbLandGrid');
  if(!list.length){ grid.innerHTML='<div class="wb-empty" style="grid-column:1/-1">没有匹配的地块</div>'; return; }
  grid.innerHTML=list.map(function(l){
    var recCount=getRecords(l.land_id).length;
    return '<div class="wb-land-card link" onclick="location.hash=\'#/land/'+esc(l.land_id)+'\'">'+
      '<div class="lc-top"><div><div class="lc-name">'+esc(l.name)+'</div><div class="lc-code">'+(l.code||'无编号')+'</div></div>'+
      '<span class="wb-status '+(l.status==='planting'?'st-planting':(l.status==='fallow'?'st-fallow':'st-wait'))+'">'+(STATUS_LABEL[l.status]||'待播种')+'</span></div>'+
      '<div class="lc-row"><span>面积</span><b>'+landAreaMu(l).toFixed(2)+' 亩</b></div>'+
      '<div class="lc-row"><span>作物</span><b>'+(l.crop||'—')+'</b></div>'+
      '<div class="lc-row"><span>位置 / 农场</span><b>'+esc(l.planting_location||l.farm||'—')+'</b></div>'+
      '<div class="lc-row"><span>播期</span><b>'+(l.plant_date||'—')+'</b></div>'+
      '<div class="lc-row"><span>农事记录</span><b>'+recCount+' 条</b></div>'+
      '<div class="lc-row"><span>边界</span><b>'+(hasLandGeo(l)?'已绘制':'未绘制')+'</b></div>'+
    '</div>';
  }).join('');
}

function boundarySection(land){
  var g=landGeo(land);
  var hasGeo=g && g.poly && g.poly.length>=3;
  if(hasGeo){
    var mu=parseFloat(g.mu)||(parseFloat(g.sqm)||0)/666.67;
    return '<div class="wb-panel" style="margin-top:16px">'+
      '<div class="wb-list-head"><h3 style="margin:0;font-size:14px;font-weight:700;color:var(--g-800)">空间边界</h3>'+
        '<button class="wb-btn wb-btn-light" onclick="openDrawBoundary(\''+esc(land.land_id)+'\')">重新绘制</button></div>'+
      '<div class="wb-rec" style="border:none;background:var(--g-50)">'+
        '<div class="wb-rec-meta">✓ 已绘制边界 ｜ 来源：'+(esc(g.source)||'runye-irrigation')+' ｜ 实测：'+(parseFloat(g.sqm)||0).toFixed(0)+' m²（'+mu.toFixed(2)+' 亩）</div>'+
        '<div class="wb-rec-meta">顶点数：'+(g.poly?g.poly.length:0)+' ｜ 灌溉方案可在精准灌溉内基于该边界生成</div>'+
      '</div></div>';
  }
  return '<div class="wb-panel" style="margin-top:16px;background:#fff7ed;border-color:#fed7aa">'+
    '<div class="wb-list-head"><h3 style="margin:0;font-size:14px;font-weight:700;color:#c2410c">尚未绘制边界</h3>'+
      '<button class="wb-btn wb-btn-primary" onclick="openDrawBoundary(\''+esc(land.land_id)+'\')">绘制边界</button></div>'+
    '<div class="wb-rec-meta" style="color:#9a3412">在精准灌溉页面画图并保存后，边界与实测面积会回写此处，灌溉方案才能与地块关联。也可先不画，事后在此补绘。</div>'+
  '</div>';
}

/* ---- 周期数据 ---- */
function cyclePanel(land){
  var recs=getRecords(land.land_id).slice().sort(function(a,b){return (a.operate_date||'')<(b.operate_date||'')?-1:1;});
  // 用量：按类型和单位分别汇总，避免 kg、ml、m³ 等混加。
  var usage={};
  recs.forEach(function(r){
    if(r.dosage){ addDosageUsage(usage, r.record_type, r.dosage); }
  });
  var counts={}; RECORD_TYPES.forEach(function(t){counts[t]=0;});
  recs.forEach(function(r){ counts[r.record_type]=(counts[r.record_type]||0)+1; });

  var tl = recs.length? '<div class="wb-tl">'+recs.map(function(r){
    return '<div class="wb-tl-item"><div class="wb-tl-date">'+esc(r.operate_date||'')+'</div>'+
      '<div class="wb-tl-title"><span class="wb-rec-type rt-'+esc(r.record_type)+'">'+esc(r.record_type)+'</span> '+(r.material_name?esc(r.material_name):'')+'</div>'+
      '<div class="wb-rec-meta">'+(r.dosage?'用量 '+esc(r.dosage)+' ｜ ':'')+(r.method?esc(r.method):'')+(r.actual_cost?' ｜ 金额 ¥ '+esc(r.actual_cost):'')+(r.yield_qty?' ｜ 产量 '+esc(r.yield_qty)+' '+esc(r.yield_unit||''):'')+'</div>'+
      (r.remark?'<div class="wb-rec-remark">'+esc(r.remark)+'</div>':'')+'</div>';
  }).join('')+'</div>' : '<div class="wb-empty">暂无周期数据，录入农事后会自动生成时间轴</div>';

  var costHtml='<div class="wb-cost-grid">';
  RECORD_TYPES.forEach(function(t){
    var uText=formatUsage(usage[t]);
    costHtml+='<div class="wb-cost"><div class="c-label">'+esc(t)+'（次 / 用量）</div><div class="c-val">'+counts[t]+(uText?' · '+esc(uText):'')+'</div></div>';
  });
  costHtml+='</div><div class="wb-form-note" style="margin-top:10px">说明：用量按单位分别汇总，kg/亩、ml/亩、m³ 等不会混加；若需折算金额，可在物资字典补充单价后扩展。</div>';

  return '<h3 style="font-size:14px;font-weight:700;color:var(--g-800);margin-bottom:10px">本地块用量统计（肥 / 药 / 灌溉投入汇总）</h3>'+costHtml+

function switchTab(btn){
  var tab=btn.getAttribute('data-tab');

  }).join(''):'<tr><td colspan="6" class="wb-empty">未来 7 天暂无集中作业窗口；请确认地块状态、作物和种植/播种日期。</td></tr>';
  main.innerHTML=''+
    '<h1 class="wb-section-title">统防调度看板</h1>'+
    '<div class="wb-sub">把单地块决策合并成多地块作业窗口，方便统一派工、统一备药、统一复盘。</div>'+

      statCard('3天内窗口',three.length,'项')+

    '</div>'+

    '<div class="wb-form-note" style="margin-top:10px">说明：番茄、辣椒为规模化通用模板；七彩花生继续读取原全程植保方案。具体药肥用量需按产品标签和现场情况校准。</div>';
}
function renderPurchase(main){
  var demand=aggregatePlanDemand(15);
  var rows=demand.length?demand.map(function(d){
    var m=d.material||{}, stock=parseFloat(m.stock_qty)||0, safe=parseFloat(m.safe_stock)||0;
    var need=Math.max(0,d.qty+safe-stock);
    var c=need>0?'danger':'ok';
    return '<tr><td>'+esc(d.name)+'<br><small>'+(m.material_id?'已建物资':'未建物资')+'</small></td><td>'+esc(m.category||'—')+'</td><td>'+fmtNum(d.qty)+' '+esc(d.unit)+'</td><td>'+(m.material_id?fmtNum(stock)+' '+esc(m.unit||d.unit):'—')+'</td><td>'+(m.material_id?fmtNum(safe)+' '+esc(m.unit||d.unit):'—')+'</td><td><span class="wb-status '+(c==='danger'?'st-wait':'st-planting')+'">'+fmtNum(need)+' '+esc(d.unit)+'</span></td><td>'+(d.cost?'¥ '+Math.round(d.cost):'—')+'</td></tr>';
  }).join(''):'<tr><td colspan="7" class="wb-empty">未来 15 天暂无可解析的计划用量；可先维护种植日期、作物和物资字典。</td></tr>';
  var totalCost=demand.reduce(function(s,d){return s+d.cost;},0);
  var missing=demand.filter(function(d){return !d.material;}).length;
  var purchase=demand.filter(function(d){var m=d.material||{};return d.material && d.qty+(parseFloat(m.safe_stock)||0)>(parseFloat(m.stock_qty)||0);}).length;
  main.innerHTML=''+
    '<h1 class="wb-section-title">农资采购测算</h1>'+
    '<div class="wb-sub">按未来 15 天所有种植中地块的作业窗口汇总农资需求，结合库存和安全库存形成采购缺口。</div>'+
    '<div class="wb-grid wb-stats" style="grid-template-columns:repeat(4,1fr);margin-top:18px">'+
      statCard('计划物资',demand.length,'种')+
      statCard('需要采购',purchase,'种')+
      statCard('未建物资',missing,'种')+
      statCard('估算金额','¥ '+Math.round(totalCost),'')+
    '</div>'+
    '<div style="margin:16px 0;display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="wb-btn wb-btn-light" onclick="openMaterialModal()">维护物资字典</button>'+
      '<button class="wb-btn wb-btn-light" onclick="location.hash=\'#/dispatch\'">返回调度看板</button>'+
    '</div>'+
    '<div class="wb-panel" style="padding:0;overflow:auto"><table class="wb-table"><thead><tr><th>物资</th><th>类别</th><th>计划需求</th><th>当前库存</th><th>安全库存</th><th>建议采购</th><th>估算金额</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="wb-form-note" style="margin-top:10px">说明：采购量按方案文字中的“每亩用量 × 实测面积”估算；未建物资无法匹配库存和单价，请先补入物资字典。</div>';
}

function renderReports(main){
  var lands=getLands();
  var totalRecs=getRecords().length;
  var rows=lands.map(function(l){
    var recs=getRecords(l.land_id);
    var byType={}; RECORD_TYPES.forEach(function(t){byType[t]=0;});
    var cost=0, revenue=0, area=landAreaMu(l);
    recs.forEach(function(r){ byType[r.record_type]=(byType[r.record_type]||0)+1; cost+=estimateRecordCost(r,l); revenue+=recordRevenue(r); });
    return {land:l,total:recs.length,byType:byType,cost:cost,revenue:revenue,profit:revenue-cost,muCost:area>0?cost/area:0};
  });
  var tableRows=rows.length?rows.map(function(r){
    return '<tr><td><a href="#/land/'+esc(r.land.land_id)+'" style="color:var(--g-700);font-weight:600">'+esc(r.land.name)+'</a></td>'+
      '<td>'+landAreaMu(r.land).toFixed(2)+'</td>'+
      '<td>'+esc(r.land.crop||'—')+'</td>'+
      '<td>'+r.total+'</td>'+
      '<td>'+(r.byType['施肥']||0)+'</td><td>'+(r.byType['用药']||0)+'</td>'+
      '<td>'+(r.byType['灌溉']||0)+'</td><td>'+(r.byType['采收']||0)+'</td>'+
      '<td>¥ '+Math.round(r.cost)+'</td><td>¥ '+Math.round(r.revenue)+'</td><td>¥ '+Math.round(r.profit)+'</td><td>¥ '+r.muCost.toFixed(1)+'</td></tr>';
  }).join(''):'<tr><td colspan="12" class="wb-empty">暂无地块数据</td></tr>';
  var cropMap={};
  rows.forEach(function(r){
    var k=r.land.crop||'未填作物';
    cropMap[k]=cropMap[k]||{area:0,cost:0,revenue:0,count:0};
    cropMap[k].area+=landAreaMu(r.land); cropMap[k].cost+=r.cost; cropMap[k].revenue+=r.revenue; cropMap[k].count++;
  });
  var cropRows=Object.keys(cropMap).length?Object.keys(cropMap).map(function(k){
    var c=cropMap[k], profit=c.revenue-c.cost;
    return '<tr><td>'+esc(k)+'</td><td>'+c.count+'</td><td>'+c.area.toFixed(1)+' 亩</td><td>¥ '+Math.round(c.cost)+'</td><td>¥ '+Math.round(c.revenue)+'</td><td>¥ '+Math.round(profit)+'</td></tr>';
  }).join(''):'<tr><td colspan="6" class="wb-empty">暂无作物汇总</td></tr>';
  var totalCost=rows.reduce(function(s,r){return s+r.cost;},0), totalRevenue=rows.reduce(function(s,r){return s+r.revenue;},0);
  var totalArea=lands.reduce(function(s,l){return s+landAreaMu(l);},0);
  main.innerHTML=''+
    '<h1 class="wb-section-title">报表与经营统计中心</h1>'+
    '<div class="wb-sub">多地块汇总统计：农事记录、投入成本、采收收入、作物对比和亩均经营指标。</div>'+
    '<div class="wb-grid wb-stats" style="grid-template-columns:repeat(4,1fr)">'+
      statCard('地块总数',lands.length,'块')+
      statCard('总面积',totalArea.toFixed(1),'亩')+
      statCard('估算投入','¥ '+Math.round(totalCost),'')+
      statCard('采收收入','¥ '+Math.round(totalRevenue),'')+
    '</div>'+
    '<h2 class="wb-section-title">各地块投入产出</h2>'+
    '<div class="wb-panel" style="padding:0;overflow:auto"><table class="wb-table"><thead><tr>'+
      '<th>地块</th><th>面积(亩)</th><th>作物</th><th>记录</th><th>施肥</th><th>用药</th><th>灌溉</th><th>采收</th><th>投入</th><th>收入</th><th>毛收益</th><th>亩均成本</th>'+
    '</tr></thead><tbody>'+tableRows+'</tbody></table></div>'+
    '<h2 class="wb-section-title">各作物经营对比</h2>'+
    '<div class="wb-panel" style="padding:0;overflow:auto"><table class="wb-table"><thead><tr><th>作物</th><th>地块数</th><th>面积</th><th>投入</th><th>收入</th><th>毛收益</th></tr></thead><tbody>'+cropRows+'</tbody></table></div>'+
    '<h2 class="wb-section-title">数据管理（备份 / 迁移 / 分享）</h2>'+
    '<div class="wb-panel" style="padding:12px 14px">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">'+
        '<button class="wb-btn wb-btn-primary" onclick="exportFullDB()">导出全部数据（JSON 备份）</button>'+
        '<button class="wb-btn wb-btn-light" onclick="triggerFileInput(importFullDB)">导入全部数据（恢复 / 接收分享）</button>'+

    '</div><div id="matWrap"></div>';
}

/* ============================================================
   导出 CSV
   ============================================================ */
function buildCSV(lands){
  var rows=[['地块名称','编号','面积(亩)','作物','品种/茬口','状态','种植/播种日期','预计采收','种植地点','种植方式','土壤','底肥方案','备注']];
  lands.forEach(function(l){ rows.push([l.name,l.code||'',l.area,l.crop||'',l.variety||'',STATUS_LABEL[l.status]||'',l.plant_date||'',l.harvest_date||'',l.planting_location||l.farm||'',l.planting_method||'',l.soil_type||'',l.base_fertilizer||'',l.remark||'']); });
  rows.push([]);
  rows.push(['—— 农事记录 ——']);
  rows.push(['地块','日期','类型','物资','用量','方式','操作人','安全间隔期(天)','实际金额','工时','人工费','采收产量','产量单位','销售额','备注']);
  lands.forEach(function(l){
    getRecords(l.land_id).forEach(function(r){
      rows.push([l.name,r.operate_date,r.record_type,r.material_name||'',r.dosage||'',r.method||'',r.operator||'',r.interval_days||'',r.actual_cost||'',r.work_hours||'',r.labor_cost||'',r.yield_qty||'',r.yield_unit||'',r.sale_amount||'',r.remark||'']);
    });
  });
  return '﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
}
function downloadCSV(filename, csv){
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function exportCSV(){ downloadCSV('地块全周期档案_'+todayISO()+'.csv', buildCSV(getLands())); }
function exportLandCSV(id){ var l=getLand(id); if(l) downloadCSV('地块档案_'+esc(l.name)+'_'+todayISO()+'.csv', buildCSV([l])); }

/* ============================================================
   数据迁移与方案模板（备份 / 迁移 / 分享 / 复制）
   ============================================================ */
function downloadFile(filename, content, mime){
  var blob=new Blob([content],{type:(mime||'application/octet-stream')+';charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 2000);
}
function exportFullDB(){
  var payload={ tool:'runye-workbench', schema_version:DB_VERSION, exported_at:new Date().toISOString(), db:DB };
  downloadFile('润野工作台数据_'+todayISO()+'.json', JSON.stringify(payload,null,2), 'application/json');
}
function importFullDB(file){
  if(!file){ return; }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var payload=JSON.parse(e.target.result);
      var db=(payload&&payload.db)?payload.db:payload; // 兼容直接导出的 DB
      if(!db||!Array.isArray(db.lands)){ alert('文件格式不正确：未找到 lands 数据。'); return; }
      if(!confirm('导入将覆盖当前全部数据（地块/记录/物资/待办/方案）。\n建议先点「导出全部数据」备份。确定继续？')){ return; }
      DB=dbInit(); // 重置缺省字段，避免旧文件缺字段
      Object.keys(db).forEach(function(k){ if(k in DB){ DB[k]=db[k]; } });
      dbSave(DB);
      alert('导入成功，共 '+DB.lands.length+' 个地块。页面即将刷新。');
      location.reload();
    }catch(err){ alert('解析失败：'+err.message); }
  };
  reader.readAsText(file);
}
function getPlanList(){
  var builtin=[
    {key:'qicai_peanut',name:'七彩花生全程植保方案',nodes:QICAI_NODES,detail:true,cropKeys:['七彩','花生','peanut'],source:'builtin'},
    {key:'tomato',name:'番茄规模化水肥植保方案',nodes:TOMATO_NODES,detail:false,cropKeys:['番茄','西红柿','tomato'],source:'builtin'},
    {key:'pepper',name:'辣椒规模化水肥植保方案',nodes:PEPPER_NODES,detail:false,cropKeys:['辣椒','pepper','chili'],source:'builtin'},
    {key:'general',name:'通用作物巡田方案',nodes:GENERAL_NODES,detail:false,cropKeys:[],source:'builtin'}
  ];
  var custom=(DB.crop_plans||[]).map(function(p){ return {key:p.key,name:p.name,nodes:p.nodes,detail:!!p.detail,cropKeys:p.cropKeys||[],source:'custom'}; });
  return builtin.concat(custom);
}
function getPlanByKey(key){
  var list=getPlanList();
  for(var i=0;i<list.length;i++){ if(list[i].key===key) return list[i]; }
  return null;
}
function exportPlanTemplate(plan){
  if(!plan){ return; }
  var payload={ tool:'runye-workbench-plan', schema_version:1, exported_at:new Date().toISOString(),
    key:plan.key, name:plan.name, detail:!!plan.detail, cropKeys:plan.cropKeys||[], nodes:plan.nodes };
  downloadFile('方案模板_'+esc(plan.name)+'_'+todayISO()+'.json', JSON.stringify(payload,null,2), 'application/json');
}
function importPlanTemplate(file){
  if(!file){ return; }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var p=JSON.parse(e.target.result);
      if(!p||!Array.isArray(p.nodes)){ alert('方案模板格式不正确：未找到 nodes。'); return; }
      var baseKey=(p.key||('custom_'+Date.now().toString(36)));
      var key=(DB.crop_plans||[]).some(function(x){return x.key===baseKey;}) ? (baseKey+'_'+Date.now().toString(36).slice(-4)) : baseKey;
      DB.crop_plans=DB.crop_plans||[];
      DB.crop_plans.push({ key:key, name:p.name||'自定义方案', detail:!!p.detail, cropKeys:p.cropKeys||[], nodes:p.nodes });
      dbSave(DB);
      alert('方案「'+(p.name||'自定义方案')+'」已导入到方案库。');
      router();
    }catch(err){ alert('解析失败：'+err.message); }
  };
  reader.readAsText(file);
}
function triggerFileInput(handler){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){ if(inp.files&&inp.files[0]){ handler(inp.files[0]); } };
  inp.click();
}
function planLibraryHtml(){
  var plans=getPlanList();
  var items=plans.map(function(p){
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f3f0">'+
      '<span style="flex:1"><b>'+esc(p.name)+'</b> <span class="wb-muted" style="font-size:12px">· '+(p.source==='custom'?'自定义':'内置')+' · '+p.nodes.length+' 节点</span></span>'+
      '<button class="wb-btn wb-btn-light" style="padding:4px 10px;font-size:12px" onclick="exportPlanTemplate(getPlanByKey(\''+esc(p.key)+'\'))">导出模板</button>'+
    '</div>';
  }).join('');
  return '<div class="wb-panel" style="padding:12px 14px;margin-top:10px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
      '<b style="font-size:13px">作物方案库</b>'+
      '<button class="wb-btn wb-btn-primary" style="padding:4px 12px;font-size:12px" onclick="triggerFileInput(importPlanTemplate)">导入方案模板</button>'+
    '</div>'+ items +
    '<div class="wb-form-note" style="margin-top:6px">导出的方案模板为 JSON，可发给同行导入即用；导入后按作物关键词自动匹配到对应地块。</div>'+
  '</div>';
}
