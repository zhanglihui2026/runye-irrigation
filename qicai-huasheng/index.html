<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七彩花生全程植保技术方案</title>
<style>
  :root{
    --green:#2f7d32; --green-dark:#1b5e20; --green-light:#e8f5e9;
    --earth:#8d6e3c; --water:#2b7bb0; --gold:#f4a318;
    --bg:#fbfaf6; --card:#ffffff; --text:#2b2b27; --muted:#6b6b63;
    --line:#e6e2d8; --shadow:0 6px 24px rgba(40,40,30,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.62;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .rainbow{background:linear-gradient(90deg,#e74c3c,#f39c12,#2ecc71,#2b7bb0,#8e44ad,#e84393);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* NAV */
  nav{position:sticky;top:36px;z-index:50;background:rgba(251,250,246,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    box-shadow:0 3px 14px rgba(15,40,15,.08)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:54px}
  .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:14px;height:14px;border-radius:50%;
    background:conic-gradient(#e74c3c,#f39c12,#2ecc71,#2b7bb0,#8e44ad,#e84393,#e74c3c)}
  .nav-links{display:flex;gap:18px;font-size:13.5px;font-weight:600}
  .nav-links a{color:var(--muted);transition:color .2s}
  .nav-links a:hover,.nav-links a.active{color:var(--green)}
  .nav-toggle{display:none;font-size:22px;background:none;border:none;cursor:pointer}

  /* HERO */
  .hero{position:relative;color:#fff;overflow:hidden;border-radius:0 0 28px 28px}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(15,40,15,.35),rgba(15,40,15,.78))}
  .hero-inner{position:relative;z-index:2;padding:64px 20px 54px;text-align:center}
  .hero h1{font-size:clamp(25px,4.3vw,40px);font-weight:900;letter-spacing:1px;
    text-shadow:0 3px 18px rgba(0,0,0,.4)}
  .hero p.sub{margin-top:12px;font-size:clamp(14px,2.2vw,17px);opacity:.95}
  .hero .chips{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    padding:14px 22px;border-radius:14px;backdrop-filter:blur(4px);min-width:150px}
  .chip b{display:block;font-size:clamp(26px,4vw,34px);font-weight:800}
  .chip span{font-size:clamp(13px,1.8vw,15px);opacity:.9}

  /* SECTIONS */
  section{padding:46px 0}
  .sec-head{text-align:center;margin-bottom:28px}
  .sec-head .k{display:inline-block;font-size:13px;font-weight:700;letter-spacing:2px;
    color:var(--green);background:var(--green-light);padding:4px 14px;border-radius:20px}
  .sec-head h2{font-size:clamp(20px,3vw,27px);font-weight:900;margin-top:12px}
  .sec-head p{color:var(--muted);max-width:720px;margin:12px auto 0;font-size:14px}

  /* OVERVIEW CARDS */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
    border-top:5px solid var(--c);transition:transform .2s}
  .card:hover{transform:translateY(-5px)}
    .card h3{margin:12px 0 5px;font-size:17px}
  .card .cost{font-size:22px;font-weight:900;color:var(--c);margin-top:10px}
  .card .cost small{font-size:13px;color:var(--muted);font-weight:600}
  .card ul{margin-top:12px;padding-left:18px;font-size:13px;color:var(--muted)}
  .card ul li{margin:5px 0}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .tag{font-size:12.5px;padding:5px 12px;border-radius:20px;background:var(--green-light);color:var(--green-dark);font-weight:600}
  .card p.detail-desc{font-size:13.5px;color:var(--text);margin-top:8px;line-height:1.7}
  /* 用药用肥明细表：每种药/肥 + 用量 + 施用方式 */
  .dose{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
  .dose-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;
    padding:6px 0;border-bottom:1px solid #f2efea}
  .dose-row:last-child{border-bottom:0}
  .dose-name{font-size:13px;font-weight:700;color:var(--c)}
  .dose-name small{font-weight:500;color:var(--muted);margin-left:4px}
  .dose-amt{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;text-align:right}
  .dose-note{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.5;margin-top:1px}
  .dose-tip{font-size:11.5px;color:#9a6b00;background:#fff7e6;border:1px solid #ffe2a8;
    border-radius:8px;padding:7px 9px;margin-top:12px;line-height:1.5}
  .dose-global{margin-top:18px;font-size:12px;color:var(--muted);background:#f7f6f2;
    border:1px solid var(--line);border-left:4px solid var(--earth);border-radius:10px;
    padding:12px 14px;line-height:1.7}
  .dose-global strong{color:var(--text)}

  /* COST */
  .cost-grid{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center;
    background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .donut{width:210px;height:210px;border-radius:50%;margin:0 auto;position:relative;
    background:conic-gradient(var(--earth) 0 37.5%,var(--green) 37.5% 60%,var(--water) 60% 100%)}
  .donut::after{content:"";position:absolute;inset:30px;background:var(--card);border-radius:50%;
    box-shadow:inset 0 0 0 1px var(--line)}
  .donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}
  .donut .center b{font-size:26px;font-weight:900;color:var(--text)}
  .donut .center span{font-size:13px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:12px}
  .lg{display:flex;align-items:center;gap:12px}
  .lg .sw{width:16px;height:16px;border-radius:5px;flex:none}
  .lg .nm{flex:1;font-weight:700}
  .lg .vl{font-weight:800;color:var(--text)}
  .lg .pc{color:var(--muted);font-size:12px;width:54px;text-align:right}
  .bar{height:10px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px}
  .total-line{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:baseline}
  .total-line b{font-size:26px;color:var(--gold);font-weight:900}
  .total-line span{color:var(--muted);font-size:13px}

  /* TIMELINE — 周次阶段对照表 */
  .wk-tip{font-size:12.5px;color:var(--muted);margin:2px 0 14px}
  .wk-tip .mod-tag{margin:0 2px}
  .mod-tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:12px;font-weight:700;white-space:nowrap}
  .mod-tag.e{background:#f3ead9;color:var(--earth)}
  .mod-tag.g{background:var(--green-light);color:var(--green)}
  .mod-tag.w{background:#dcecf6;color:var(--water)}
  .wk-table{min-width:780px}
  .wk-table td .npill{margin:0 4px 4px 0}
  .npill{font-size:11px;padding:2px 7px;border-radius:12px;font-weight:600;display:inline-block}
  .npill.g{background:var(--green-light);color:var(--green)}
  .npill.w{background:#dcecf6;color:var(--water)}
  .npill.e{background:#f3ead9;color:var(--earth)}

  /* TABLES */
  .plan-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:26px;border-top:5px solid var(--c)}
  .plan-head{background:var(--c-soft);padding:14px 20px;display:flex;align-items:center;gap:14px}
    .plan-head h3{font-size:19px;color:var(--text)}
  .plan-head .ph-cost{margin-left:auto;font-weight:800;color:var(--c);font-size:16px}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
  thead th{background:var(--text);color:#fff;padding:10px 11px;text-align:left;font-weight:600;white-space:nowrap}
  tbody td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:#fcfbf6}
  .stage-row td{background:var(--c-soft);font-weight:800;color:var(--c);padding:8px 12px;letter-spacing:.5px}
  .nd{width:34px;text-align:center;vertical-align:middle;font-weight:800;color:var(--water);font-size:12.5px}
  .prod{font-weight:700;color:var(--text)}
  .target{color:var(--muted)}
  .dose{white-space:nowrap;font-weight:600}
  tfoot td{background:var(--green-light);font-weight:800;padding:12px;color:var(--green-dark)}
  /* 操作历：已删除「约周次」列(天数更精准)，现 作业=第3列、用几种=第4列，加宽并强制两行；
     表头字号不变(13px)，仅内容行整体缩小，阶段分隔行保留强调字号 */
  #schedule table thead th:nth-child(2){width:140px;min-width:140px;white-space:normal;text-align:center}
  #schedule table tbody td:nth-child(2){width:140px;min-width:140px;white-space:normal;text-align:center;vertical-align:middle;line-height:1.5;font-weight:600}
  #schedule table thead th:nth-child(3),#schedule table thead th:nth-child(4){white-space:normal;text-align:center}
  #schedule table tbody td:nth-child(3){width:72px;min-width:72px;white-space:normal;text-align:center;vertical-align:middle;line-height:1.4;font-weight:600}
  #schedule table tbody td:nth-child(4){width:104px;min-width:104px;white-space:normal;text-align:center;vertical-align:middle;line-height:1.4;font-weight:600}
  /* 内容行整体缩小 + 紧凑内边距，表头保持 13px 不变 */
  #schedule table tbody td{font-size:12px;padding:7px 10px}
  #schedule table tbody tr.stage-row td{font-size:13px;padding:8px 12px}

  /* 控旺专篇 */
  .ctrl-table{min-width:760px}
  .ctrl-table td:nth-child(1){white-space:nowrap;font-weight:800;color:var(--green-dark);text-align:center;width:62px}
  .ctrl-table td:nth-child(2){white-space:nowrap;font-weight:700;color:var(--water);text-align:center;width:92px}
  /* 四遍 vs 五遍 对比表：文字与标题左对齐 */
  .ctrl-table.compare{min-width:480px}
  .ctrl-table.compare thead th,
  .ctrl-table.compare tbody td{text-align:left;padding-left:20px;padding-right:16px}
  .ctrl-table.compare td:nth-child(1),
  .ctrl-table.compare td:nth-child(2){width:auto;white-space:normal;text-align:left}
  .ctrl-table.compare td:nth-child(1){font-weight:800;color:var(--green-dark)}
  .ctrl-table.compare td:nth-child(2){font-weight:400;color:var(--text)}
  .ctrl-table td:nth-child(4){white-space:nowrap;text-align:center;width:96px}

  /* NOTES */
  .notes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .note{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);
    border-left:4px solid var(--gold)}
  .note b{display:block;margin-bottom:6px;color:var(--green-dark)}
  .note p{font-size:13px;color:var(--muted)}

  /* FARM IMAGE BANNER */
  .farm{position:relative;border-radius:var(--radius);overflow:hidden;color:#fff;
    box-shadow:var(--shadow);min-height:230px;display:flex;align-items:flex-end}
  .farm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .farm::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(15,40,15,.8))}
  .farm .ft{position:relative;z-index:2;padding:24px}
  .farm h3{font-size:21px;margin-bottom:8px}
  .farm p{max-width:560px;font-size:13.5px;opacity:.95}

  footer{background:var(--green-dark);color:#e8f5e9;text-align:center;padding:32px 20px;margin-top:24px}
  footer .big{font-size:26px;font-weight:900;color:#fff}
  footer .big em{font-style:normal;color:var(--gold)}
  footer p{opacity:.85;font-size:13px;margin-top:10px}

  @media(max-width:860px){
    .cards,.split,.cost-grid,.notes{grid-template-columns:1fr}
    .cost-grid{gap:24px}
    .nav-links{position:absolute;top:60px;right:0;left:0;flex-direction:column;gap:0;
      background:var(--bg);border-bottom:1px solid var(--line);display:none}
    .nav-links.open{display:flex}
    .nav-links a{padding:14px 20px;border-bottom:1px solid var(--line)}
    .nav-toggle{display:block}
  .dec-note ul,.dec-warn ul{margin:4px 0 0 18px}

  /* 密码门：未解锁前遮挡整页内容（含常驻顶栏），仅展示解锁卡片 */
  #gate{display:none;position:fixed;inset:0;z-index:999999;
    align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg,#0f2e16 0%,#1b5e20 55%,#2f7d32 100%)}
  body.locked{overflow:hidden}
  body.locked #gate{display:flex}
  body.locked > *:not(#gate){display:none !important}
  .gate-card{width:100%;max-width:380px;background:#fff;border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);padding:30px 28px;text-align:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif}
  .gate-card .lock{width:54px;height:54px;border-radius:50%;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    background:var(--green-light);color:var(--green)}
  .gate-card h2{font-size:19px;color:#1b5e20;margin-bottom:6px}
  .gate-card p{font-size:13px;color:#6b6b63;margin-bottom:18px;line-height:1.5}
  .gate-card input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:15px;
    border:1.5px solid var(--line);border-radius:10px;outline:none;margin-bottom:12px;
    text-align:center;letter-spacing:2px}
  .gate-card input:focus{border-color:var(--green)}
  .gate-card button{width:100%;padding:12px;border:0;border-radius:10px;cursor:pointer;
    background:var(--green);color:#fff;font-size:15px;font-weight:700;transition:.15s}
  .gate-card button:hover{background:var(--green-dark)}
  .gate-err{display:none;color:#c0392b;font-size:13px;margin:-4px 0 12px}
  .gate-links{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:12px}
  .gate-links a{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:999px;background:var(--green-light);color:var(--green-dark);font-weight:700;text-decoration:none}
</style>
</head>

  <div class="gate-card">

    <h2>植保方案 · 访问受限</h2>

    <input id="gatePwd" type="password" placeholder="请输入访问密码" autocomplete="off" autofocus>
    <div class="gate-err" id="gateErr">密码错误，请重试</div>
    <button id="gateBtn" type="button">查看方案</button>
    <div class="gate-links">
      <a href="../数字农业.html">数字农业</a>
      <a href="../peanut-tool.html">水肥植保决策</a>
      <a href="../workbench.html">数字工作台</a>
    </div>
  </div>
</div>

<script>
(function(){
  var ACCESS_PASSWORD = "qicai2026";
  var ENC = document.getElementById('enc').textContent;
  var body = document.body;
  var input = document.getElementById('gatePwd');
  var btn = document.getElementById('gateBtn');
  var err = document.getElementById('gateErr');
  var prot = document.getElementById('protected');

  function hashStr(s){ var h=2166136261>>>0; for(var k=0;k<s.length;k++){ h^=s.charCodeAt(k); h=Math.imul(h,16777619)>>>0;} return h>>>0; }
  function xorBytes(bytes, pw){ var seed=hashStr(pw)||1; var s=seed>>>0; var out=new Uint8Array(bytes.length); for(var k=0;k<bytes.length;k++){ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; out[k]=bytes[k]^(s&0xff);} return out; }
  function b64ToBytes(b64){ var bin=atob(b64); var o=new Uint8Array(bin.length); for(var k=0;k<bin.length;k++) o[k]=bin.charCodeAt(k); return o; }
  function decrypt(b64, pw){
    try{
      var bytes = xorBytes(b64ToBytes(b64), pw);
      var str = new TextDecoder().decode(bytes);
      if(str.indexOf('PROTECTED_OK') === -1) return null;
      return str;
    }catch(e){ return null; }
  }
  function inject(html){
    prot.innerHTML = html.replace(/PROTECTED_OK/g, '');
    ensureGlobalLinks();
    initNav();
  }
  function ensureGlobalLinks(){
    var links = document.getElementById('navLinks') || document.querySelector('.nav-links');
    if(!links) return;
    var items = [
      {href:'../数字农业.html', text:'数字农业'},
      {href:'../peanut-tool.html', text:'水肥植保决策'},
      {href:'../workbench.html', text:'数字工作台'}
    ];
    items.forEach(function(item){
      var exists = Array.prototype.some.call(links.querySelectorAll('a'), function(a){ return a.getAttribute('href') === item.href || a.textContent.trim() === item.text; });
      if(!exists){
        var a = document.createElement('a');
        a.href = item.href;
        a.textContent = item.text;
        links.appendChild(a);
      }
    });
  }
  function initNav(){
    var toggle = document.querySelector('.nav-toggle');
    var links = document.getElementById('navLinks');
    if(toggle && links){
      toggle.addEventListener('click', function(){ links.classList.toggle('open'); });
      links.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ links.classList.remove('open'); }); });
    }
    var secs = Array.prototype.slice.call(document.querySelectorAll('section[id]'));
    var navA = Array.prototype.slice.call(document.querySelectorAll('.nav-links a'));
    if('IntersectionObserver' in window){
      var obs = new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ var id=e.target.id; navA.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+id); }); } });
      }, {rootMargin:'-45% 0px -50% 0px'});
      secs.forEach(function(s){ obs.observe(s); });
    }
  }
  function tryUnlock(){
    var plain = decrypt(ENC, input.value.trim());
    if(plain){
      inject(plain);
      body.classList.remove('locked');
      try{ sessionStorage.setItem('qicai_gate','1'); }catch(e){}
      err.style.display='none';
    } else {
      err.style.display='block';
      input.value='';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });

  // 同标签页已解锁则不再重复提示（仍需本地解密，密码在常量中）
  try{
    if(sessionStorage.getItem('qicai_gate') === '1'){
      var plain = decrypt(ENC, ACCESS_PASSWORD);
      if(plain){ inject(plain); body.classList.remove('locked'); return; }
    }
  }catch(e){}
  input.focus();
})();
</script>
