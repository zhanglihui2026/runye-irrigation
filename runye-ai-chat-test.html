function simulation(full,src,o){let length=o.tapeLen,head;
 if(src.kind==='design'){head=+src.data.hydraulics.tapePressureM;}else{const tape=full.tapeRows.filter(t=>t.attached).sort((a,b)=>b.hf-a.hf)[0];if(!tape)return null;length=tape.len;head=o.dripHead+tape.hf;}

      p.zoneMu=+(cur.zoneMu*cur.zones/p.zones).toFixed(1);}
