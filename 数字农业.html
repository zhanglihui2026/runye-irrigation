<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字农业 · 七彩花生水肥决策｜润野灌溉</title>
<style>
  :root{
    --g-50:#f0fdf4;--g-100:#dcfce7;--g-200:#bbf7d0;--g-500:#22c55e;--g-600:#16a34a;--g-700:#15803d;--g-800:#166534;--g-900:#14532d;
    --teal:#0d9488;--teal-700:#0f766e;
    --s-50:#f8fafc;--s-100:#f1f5f9;--s-200:#e2e8f0;--s-300:#cbd5e1;--s-400:#94a3b8;--s-500:#64748b;--s-600:#475569;--s-700:#334155;--s-800:#1e293b;--s-900:#0f172a;
    --shadow-sm:0 2px 8px rgba(15,23,42,.06);
    --radius:14px;--transition:all .2s ease;--maxw:1280px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--s-800);background:#f7f5f0;line-height:1.6;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  a{text-decoration:none;color:inherit;}
  ul{list-style:none;}

/* ===== 统一导航（与 index.html 精准灌溉页 .ry-nav 完全一致） ===== */
.ry-nav{
  position:sticky;top:0;z-index:1500;
  --g-50:#f0fdf4;--g-100:#dcfce7;--g-200:#bbf7d0;--g-300:#86efac;--g-400:#4ade80;--g-500:#22c55e;--g-600:#16a34a;--g-700:#15803d;--g-800:#166534;--g-900:#14532d;
  --teal:#0d9488;--teal-700:#0f766e;
  --s-50:#f8fafc;--s-100:#f1f5f9;--s-200:#e2e8f0;--s-300:#cbd5e1;--s-400:#94a3b8;--s-500:#64748b;--s-600:#475569;--s-700:#334155;--s-800:#1e293b;--s-900:#0f172a;
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --transition:all .2s ease;
  --maxw:1280px;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;
}
.ry-nav .main-header{background:#fff;box-shadow:var(--shadow-sm);border-bottom:1px solid var(--s-100);padding:0;margin:0;}
.ry-nav .header-inner{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:72px;}
.ry-nav .brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.ry-nav .brand-logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g-700),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 12px rgba(22,163,74,.25);}
.ry-nav .brand-text{display:flex;flex-direction:column;line-height:1.2;}
.ry-nav .brand-name{font-size:18px;font-weight:800;color:var(--g-800);letter-spacing:.5px;}
.ry-nav .brand-sub{font-size:11px;color:var(--s-500);letter-spacing:1px;text-transform:uppercase;}
.ry-nav .main-nav{display:flex;align-items:center;gap:4px;}
.ry-nav .nav-item{position:relative;}
.ry-nav .nav-link{position:relative;display:flex;align-items:center;gap:4px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--s-700);transition:var(--transition);white-space:nowrap;text-decoration:none;}
.ry-nav .nav-link::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--g-600);opacity:0;transform:scaleX(.4);transition:var(--transition);}
.ry-nav .nav-link:hover{color:var(--g-700);}
.ry-nav .nav-link:hover::after{opacity:1;transform:scaleX(1);}
.ry-nav .nav-link.active{color:var(--g-700);}
.ry-nav .nav-link.active::after{opacity:1;transform:scaleX(1);}
.ry-nav .header-actions{display:flex;align-items:center;gap:16px;}
.ry-nav .search-btn{width:36px;height:36px;border:1px solid var(--s-200);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);color:var(--s-600);}
.ry-nav .search-btn:hover{background:var(--g-700);border-color:var(--g-700);color:#fff;}
.ry-nav .mobile-menu-btn{display:none;flex-direction:column;gap:5px;padding:8px;cursor:pointer;}
.ry-nav .nav-home-btn{margin-left:8px;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--g-700);color:#fff;font-size:14px;font-weight:700;text-decoration:none;border:0;border-radius:0;cursor:pointer;transition:var(--transition);white-space:nowrap;letter-spacing:.5px;}
.ry-nav .nav-home-btn:hover{background:var(--g-800);}

/* 手机端：导航常驻顶部一行横向滑动（取消汉堡弹窗，与精准灌溉页完全一致） */
@media(max-width:768px){
  .ry-nav .main-header{height:auto}
  .ry-nav .header-inner{flex-wrap:wrap;height:auto;align-items:center;padding:8px 14px 0;gap:0;}
  .ry-nav .brand{height:46px;flex:1 1 auto}
  .ry-nav .header-actions{margin-left:auto;order:2}
  .ry-nav .mobile-menu-btn{display:none !important}
  .ry-nav .nav-home-btn{display:none !important}
  .ry-nav .main-nav{display:flex !important;position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;order:3;gap:0;margin-top:6px;padding:0;background:#fff;box-shadow:none;border-top:1px solid var(--s-100);}
  .ry-nav .main-nav::-webkit-scrollbar{display:none}
  .ry-nav .main-nav .nav-item{flex:0 0 auto}
  .ry-nav .nav-link{padding:11px 15px;font-size:13px;border-bottom:none;border-right:1px solid var(--s-50);white-space:nowrap;}
  .ry-nav .nav-link::after{display:none}
  /* 手机端：解除整页 100vh 锁定。frame-wrap 不再占满视窗，iframe 高度由 JS 按工具内容高度设定，
     整页变为一条自然滚动流——顶部 info-bar 随滚动滚走，工具内容也可整体滚动，不再「锁定」。 */
  body{height:auto;min-height:100vh;overflow-y:auto;}
  .frame-wrap{flex:none;height:auto;min-height:auto;}
  .frame-wrap iframe{height:100vh;} /* 加载前占位，JS 加载后按内容高度覆盖 */
  .info-toggle{display:inline-flex;}
}
@media(max-width:480px){
  .ry-nav .header-inner{padding:0 12px}
  .ry-nav .brand{height:42px}
  .ry-nav .nav-link{padding:10px 12px;font-size:12px}
}

  .info-bar{background:var(--g-50);border-bottom:1px solid var(--g-200);color:var(--s-700);font-size:13px;}
  .info-inner{max-width:1240px;margin:0 auto;padding:12px 20px;box-sizing:border-box;display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:12px;}
  .info-bar .info-text{padding:0;line-height:1.6;flex:1 1 auto;}
  .info-toggle{display:none;flex:none;align-self:flex-start;margin-top:1px;background:var(--g-700);color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .info-bar.collapsed{display:none;}
  .info-bar code{background:#fff;border:1px solid var(--g-200);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--g-800);}

  .frame-wrap{position:relative;width:100%;flex:1 1 auto;min-height:0;background:var(--s-50);}
  .frame-wrap iframe{width:100%;height:100%;border:0;display:block;}

  .fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#fff;}
  .fallback.show{display:flex;}
  .fallback h2{color:var(--g-800);font-size:20px;margin-bottom:12px;}
  .fallback p{color:var(--s-600);max-width:520px;margin-bottom:8px;font-size:15px;}
  .fallback .step{background:var(--s-50);border:1px solid var(--s-200);border-radius:10px;padding:14px 18px;margin:10px 0;font-size:14px;color:var(--s-700);text-align:left;max-width:520px;}
  .fallback .step b{color:var(--g-700);}

  @media(max-width:920px){
    .info-bar{font-size:12px;}
  }
</style>

</head>
<body>

<div class="ry-nav">
<header class="main-header">
  <div class="header-inner">
    <a href="runye-landing.html" class="brand">
      <div class="brand-logo">润</div>

        <span class="brand-name">润野灌溉</span>

    <nav class="main-nav" id="mainNav">
      <div class="nav-item"><a href="index.html" class="nav-link">精准灌溉</a></div>
      <div class="nav-item"><a href="耐特菲姆滴灌带长度查询器.html" class="nav-link">滴灌带查询</a></div>

</div>

<div class="info-bar" id="infoBar">
  <div class="info-inner">
    <span class="info-text">本页内嵌「润野 · 七彩花生水肥决策」工具：浏览器端自<b>播种日起逐日采集、累积天气</b>，形成种植期数据表，并结合历史水分盈亏、积温与连雨情况<b>综合分析</b>给出每日农事建议，<b>打开网页即用</b>。</span>
    <button type="button" class="info-toggle" id="infoToggle" aria-expanded="true">收起 ▲</button>
  </div>
</div>

<div class="frame-wrap">
  <iframe id="peanutFrame" src="peanut-tool.html" title="七彩花生水肥决策" loading="eager"></iframe>
  <div class="fallback" id="fallback">
    <h2>工具内容未加载</h2>
    <p>「七彩花生水肥决策」页面未能显示，通常是 <code>peanut-tool.html</code> 未一并上传所致。</p>
    <div class="step">
      <b>解决：</b>确认 <code>peanut-tool.html</code> 已与 <code>数字农业.html</code> 放在同一目录；<br>
      或点击下方按钮刷新本页。
    </div>
    <p><button class="nav-home-btn" onclick="location.reload()">↻ 刷新本页</button></p>
  </div>
</div>

<script>
  // 探测内嵌工具是否加载；加载失败（如文件缺失）则显示兜底提示
  (function () {
    var shown = false, loaded = false;
    function showFallback(){ if(!shown){ shown = true; document.getElementById('fallback').classList.add('show'); } }
    var frame = document.getElementById('peanutFrame');
    frame.addEventListener('load', function(){ loaded = true; });
    // 给页面一点加载时间，若 iframe 始终空白则提示
    setTimeout(function(){
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        var has = doc && doc.body && doc.body.children.length > 0;
        if (!loaded && !has) showFallback();
      } catch (e) {
        // 跨域或异常时不打扰，依赖 loaded 状态
        if (!loaded) showFallback();
      }
    }, 5000);
  })();
</script>
<script>
  // 手机端：提示条「收起 / 展开」切换，避免工具 iframe 在手机上吞掉滚动导致提示常驻顶部
  (function(){
    var btn = document.getElementById('infoToggle');
    var bar = document.getElementById('infoBar');
    if(!btn || !bar) return;
    btn.addEventListener('click', function(){
      var collapsed = bar.classList.toggle('collapsed');
      btn.setAttribute('aria-expanded', String(!collapsed));
      btn.textContent = collapsed ? '展开 ▼' : '收起 ▲';
    });
  })();
</script>
<script>
  // 手机端：让内嵌工具 iframe 高度 = 其文档内容高度，整页自然滚动，顶部提示条随滚动滚走（不再被 iframe 吞滚动而常驻）
  (function(){
    var frame = document.getElementById('peanutFrame');
    if(!frame) return;
    var mq = window.matchMedia('(max-width:768px)');
    function fit(){
      if(!mq.matches){ frame.style.height=''; return; } // 桌面端：交回 100% 内部滚动
      try{
        var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
        if(!doc || !doc.body) { frame.style.height='100vh'; return; }
        var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight, 480);
        frame.style.height = h + 'px';
      }catch(e){ frame.style.height='100vh'; }
    }
    frame.addEventListener('load', function(){
      fit();
      // 工具内容动态变化（展开/收起分区、天气加载）时实时重算高度
      try{
        var doc = frame.contentDocument;
        if(doc && doc.body && 'ResizeObserver' in window){
          new ResizeObserver(fit).observe(doc.body);
        }
      }catch(e){}
      setInterval(fit, 1000); // 兜底：兼容个别浏览器 ResizeObserver 不触发的情况
    });
    window.addEventListener('resize', fit);
  })();
</script>
