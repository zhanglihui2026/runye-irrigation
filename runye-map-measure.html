<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>润野 · 地图面积测量（在线卫星图 · 免Key）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --g-700:#15803d; --g-600:#16a34a; --g-500:#22c55e; --g-50:#f0fdf4;
    --g-100:#dcfce7; --s-700:#334155; --s-600:#475569; --s-500:#64748b; --s-300:#cbd5e1; --s-200:#e2e8f0; --s-100:#f1f5f9;
    --radius:0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;color:var(--s-700);background:#f7f5f0}
  #app{display:flex;flex-direction:column;height:100vh}
  /* ===== 顶部功能区导航（2026-09-13 去重）=====
     皮肤 = runye-nav.css（唯一出处）；按钮清单 = runye-nav.js（唯一出处，
     与主页同一份 ITEMS —— 主页隐藏的「管网布置/数据对比」不在清单）。
     本页只保留布局差异：导航条吸顶 + .fn-inner 整幅排布。 */
  .fn-nav{position:sticky;top:0;z-index:1200;flex:none}
  .fn-nav .fn-inner{padding:0 12px}
  @media(max-width:768px){
    .fn-nav .fn-inner{padding:0 16px}
  }
  /* 侧栏标题栏：品牌字自导航移入此处（2026-09-13） */
  .side-brand{flex:none;padding:0 0 6px;border-bottom:1px solid var(--s-100)}
  .side-brand strong{display:block;font-size:13px;font-weight:700;color:var(--g-700);letter-spacing:1px}
  .side-brand small{display:block;margin-top:1px;font-size:10px;color:var(--s-500)}
  /* 主体：左侧工具栏 + 地图（2026-09-13 改版：原绿色顶部操作条与右侧浮动测量面板
     的全部内容集中到左侧工具栏，地图占满其余空间） */
  .main{flex:1;position:relative;display:flex;min-height:0}
  .side{flex:none;width:var(--mapSideW,250px);background:#fff;border-right:1px solid var(--s-300);
    overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
  /* 细滚动条（2026-09-20）：只写 ::-webkit-scrollbar，不写 scrollbar-width/color
     标准属性——两者并存会让 webkit 伪元素整条失效，实测回退 11px 标准条（第六十五轮） */
  .side::-webkit-scrollbar,.sr-list::-webkit-scrollbar{width:5px;height:5px}
  .side::-webkit-scrollbar-track,.sr-list::-webkit-scrollbar-track{background:transparent}
  .side::-webkit-scrollbar-thumb,.sr-list::-webkit-scrollbar-thumb{background:#bfd3c6;border-radius:2px}
  .side::-webkit-scrollbar-thumb:hover,.sr-list::-webkit-scrollbar-thumb:hover{background:#9db8a7}
  /* 左侧工具栏宽度拖拽条（2026-09-20）：拖动写 --mapSideW + localStorage 记忆，双击恢复默认；
     没拖过不写任何变量，默认宽度 250px 逐像素不变 */
  .side-grip{flex:none;width:6px;cursor:col-resize;background:transparent;touch-action:none;position:relative;z-index:5}
  .side-grip:hover,.side-grip:active{background:var(--g-100)}
  body.side-resizing{cursor:col-resize!important;user-select:none!important}
  .side section{flex:none}
  .sec-t{margin:0 0 5px;font-size:11px;color:var(--s-500);font-weight:700;letter-spacing:1px;
    border-left:3px solid var(--g-600);padding-left:8px;line-height:1.4}
  .tools{display:flex;flex-direction:column;gap:5px}
  .side input[type=text]{height:34px;padding:0 7px;border:1px solid var(--s-300);width:100%;
    font-size:12px;background:#fff;color:var(--s-700)}
  .side input[type=text]:focus{outline:1px solid var(--g-600)}
  .mbtn{height:34px;padding:0 9px;border:1px solid var(--s-300);background:#fff;color:var(--s-700);
    cursor:pointer;font-size:12px;font-weight:600;text-align:left;font-family:inherit}
  .mbtn:hover{border-color:var(--g-600);color:var(--g-700);background:var(--g-50)}
  .mbtn.btn-on{background:var(--g-500);color:#fff;border-color:var(--g-500)}
  .mbtn-primary{background:var(--g-600);color:#fff;border-color:var(--g-600);text-align:center}
  .mbtn-primary:hover{background:var(--g-700);color:#fff}
  .search-row{display:flex;gap:6px}
  .search-row input{flex:1;min-width:0}
  .search-row .mbtn{flex:none;text-align:center}
  /* 搜索结果候选 + 已保存地点（2026-09-19 v60：地点搜索 / 保存地点 / 位置记忆） */
  .sr-list{margin-top:5px;border:1px solid var(--s-300);background:#fff;max-height:158px;overflow-y:auto}
  .sr-list[hidden]{display:none}
  .sr-item{display:block;width:100%;border:0;border-bottom:1px solid var(--s-100);background:#fff;
    text-align:left;padding:5px 7px;font:inherit;font-size:11px;line-height:1.35;color:var(--s-700);cursor:pointer}
  .sr-item:last-child{border-bottom:0}
  .sr-item:hover{background:var(--g-50);color:var(--g-700)}
  .sr-item b{display:block;font-weight:600;color:inherit}
  .sr-item i{font-style:normal;display:block;font-size:10px;color:var(--s-500);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill-list{margin-top:5px;display:flex;flex-direction:column;gap:4px}
  .pill-list[hidden]{display:none}
  .place-item{display:flex;gap:4px;align-items:center}
  .place-go{flex:1 1 auto;min-width:0;height:26px;padding:0 6px;border:1px solid var(--s-300);background:#fff;
    color:var(--s-700);font:inherit;font-size:11px;text-align:left;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place-go:hover{border-color:var(--g-600);color:var(--g-700);background:var(--g-50)}
  .place-del{flex:none;width:26px;height:26px;border:1px solid var(--s-300);background:#fff;color:var(--s-500);
    font:inherit;font-size:13px;line-height:1;cursor:pointer}
  .place-del:hover{border-color:#dc2626;color:#dc2626;background:#fef2f2}
  /* 测量结果 */
  .results .row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;border-bottom:1px dashed var(--s-100)}
  .results .row .k{font-size:11px;color:var(--s-500)}
  .results .row .v{font-size:13px;font-weight:700;color:var(--g-700)}
  .results .row .v small{font-size:10px;color:var(--s-500);font-weight:400;margin-left:2px}
  .hint{font-size:10px;color:var(--s-500);margin-top:5px;line-height:1.4}
  .results .mbtn-primary{margin-top:6px;width:100%}
.save-row{margin-top:5px;display:flex;gap:6px;align-items:center;justify-content:stretch}
.save-row .mbtn{flex:1 1 0;min-width:0;white-space:nowrap;padding-left:4px;padding-right:4px}
  .ry-pin{background:transparent;border:none}
  /* 地图 */
  .map-wrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;background:#dfe6e9}
  /* 操作提示条 */
  .tip{position:absolute;left:14px;bottom:14px;background:rgba(15,23,42,.82);color:#fff;padding:8px 14px;font-size:12px;z-index:1000;border-radius:var(--radius);max-width:60%}
  /* 加载失败提示 */
  .warn{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fef3c7;color:#92400e;
    border:1px solid #f59e0b;padding:8px 14px;font-size:12px;z-index:1100;border-radius:var(--radius);display:none}
  /* 绘制模式：高对比十字光标，替代地图拖动手型，避免点错位 */
  .leaflet-container.drawing{ cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2730%27%20height%3D%2730%27%3E%3Cg%20stroke%3D%27black%27%20stroke-width%3D%273%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27white%27%20stroke-width%3D%271.5%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2715%27%20cy%3D%2715%27%20r%3D%272.5%27%20fill%3D%27white%27%20stroke%3D%27black%27%20stroke-width%3D%271%27%2F%3E%3C%2Fsvg%3E") 15 15, crosshair !important; }
  .leaflet-container.drawing .leaflet-grab{ cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2730%27%20height%3D%2730%27%3E%3Cg%20stroke%3D%27black%27%20stroke-width%3D%273%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27white%27%20stroke-width%3D%271.5%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2715%27%20cy%3D%2715%27%20r%3D%272.5%27%20fill%3D%27white%27%20stroke%3D%27black%27%20stroke-width%3D%271%27%2F%3E%3C%2Fsvg%3E") 15 15, crosshair !important; }
  /* 窄屏：左侧工具栏转为顶部横条（纵向滚动），地图仍占满剩余空间 */
  @media(max-width:700px){
    .main{flex-direction:column}
    .side{width:100%;max-height:46vh;border-right:0;border-bottom:1px solid var(--s-300)}
    .side-grip{display:none}
  }
/* ===== RY-NAV 区块已整体取消（2026-09-12）：原 .ry-nav 品牌导航栏的 50 行样式
   （.main-header/.header-inner/.brand/.main-nav/.nav-link/.nav-home-btn/.search-btn/
   .mobile-menu-btn 及 @media(max-width:768px) 手机端规则）已一并删除。
   2026-09-13 起页面顶部改为「功能区导航 .fn-nav + 左侧工具栏 .side」结构。
   恢复原值：git show HEAD:runye-map-measure.html ===== */
</style>
<link rel="stylesheet" href="runye-theme.css">
  <link rel="stylesheet" href="runye-nav.css">
</head>
<body>
<div id="app">
  <!-- 顶部功能区导航（2026-09-13 去重）：皮肤 = runye-nav.css、按钮清单 = runye-nav.js
       （与主页同一份 ITEMS —— 主页隐藏的「管网布置/数据对比」不在清单，两页按钮集一致）；
       当前页「在线地图」由 runye-nav.js 自动高亮；品牌字在左侧工具栏 .side-brand -->
  <nav class="fn-nav" aria-label="功能区导航">
    <div class="fn-inner" data-ry-fnnav data-base="index.html#"></div>
  </nav>
  <script src="runye-nav.js"></script>
  <!-- [NEW MODULE: pipe_optim] 导航按钮与主页同源（2026-09-23 用户要求：三页导航一致） -->
  <script src="pipe_optim_ui.js"></script>
  <div class="main">
    <!-- 左侧工具栏：原绿色顶部操作条（搜索/定位/底图/画框四键）+ 右侧浮动「测量结果」面板
         的全部内容集中于此（2026-09-13）。全部元素 id 未变，JS 逻辑零改动 -->
    <aside class="side">
      <div class="side-brand"><strong>润野灌溉</strong><small>地图面积测量 · 在线卫星图</small></div>
      <section>
        <h4 class="sec-t">地图</h4>
        <div class="tools">
          <div class="search-row">
            <input type="text" id="search" placeholder="搜索地点（如：三亚 崖州）" />
            <button class="mbtn" id="btnSearch">搜索</button>
          </div>
          <div class="sr-list" id="searchRes" hidden></div>
          <button class="mbtn" id="btnSavePlace">💾 保存地点</button>
          <div class="pill-list" id="placeList" hidden></div>
          <button class="mbtn" id="btnLocate">📍 定位三亚</button>
          <button class="mbtn" id="btnBase">🗺️ 切换底图</button>
          <div class="hint" id="placeHint">搜索定位后可「保存地点」；地图位置自动记住，下次打开回到上次位置。也可直接输入坐标（如 18.2528,109.5119）定位。</div>
        </div>
      </section>
      <section>
        <h4 class="sec-t">绘制</h4>
        <div class="tools">
          <button class="mbtn" id="btnDraw">✏️ 开始画框</button>
          <button class="mbtn" id="btnFinish">✅ 完成</button>
          <button class="mbtn" id="btnUndo">↩ 撤销</button>
          <button class="mbtn" id="btnClear">🗑 清除</button>
        </div>
      </section>
      <section class="results">
        <h4 class="sec-t">测量结果</h4>
        <div class="row"><span class="k">面积</span><span class="v"><span id="mu">0</span><small>亩</small></span></div>
        <div class="row"><span class="k">折合</span><span class="v"><span id="ha">0</span><small>公顷</small></span></div>
        <div class="row"><span class="k">平方</span><span class="v"><span id="sq">0</span><small>㎡</small></span></div>
        <div class="row"><span class="k">周长</span><span class="v"><span id="peri">0</span><small>m</small></span></div>
        <div class="row"><span class="k">顶点</span><span class="v"><span id="pts">0</span><small>个</small></span></div>
        <div class="hint">点击地图添加顶点；拖动顶点可微调；「完成」自动闭合并计算。面积按真实球面经纬度计算。</div>
        <div class="save-row">
          <button class="mbtn mbtn-primary" id="btnCopy">↩ 回传设计工具</button>
          <button class="mbtn mbtn-primary" id="btnSavePlot">💾 保存地块</button>
        </div>
        <div class="hint">保存后可累计多个地块；在「精准灌溉」页地块库「设为当前」，或在数字农业（水肥决策）页下拉选择。</div>
      </section>
    </aside>
    <!-- 左侧工具栏宽度拖拽条（2026-09-20）：拖动调宽、双击恢复默认 -->
    <div class="side-grip" id="mapSideGrip" title="拖动调节工具栏宽度；双击恢复默认"></div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="warn" id="warn">⚠️ 地图瓦片加载失败，请检查网络（本工具需要联网获取卫星影像）。</div>
      <div class="tip" id="tip">点击「✏️ 开始画框」后，在卫星图上依次点击地块边界顶点即可。</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  if(typeof L === 'undefined'){
    document.getElementById('warn').style.display='block';
    document.getElementById('warn').textContent='⚠️ Leaflet 库未能加载，请检查网络后刷新。';
    return;
  }

  // ===== 地图初始化 =====
  var map = L.map('map', { center:[18.2528, 109.5119], zoom:15, doubleClickZoom:false });
  // 高德卫星瓦片（免Key直连，国内快）
  var gaodeSat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
    { subdomains:'1234', maxZoom:19, attribution:'© 高德地图' });
  // 高德路网标注（叠加，可选）
  var gaodeLabel = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',
    { subdomains:'1234', maxZoom:19, opacity:0.9 });
  // OSM 街道图（备选）
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { subdomains:'abc', maxZoom:19, attribution:'© OpenStreetMap' });

  var baseLayers = { '高德卫星':gaodeSat, '高德卫星+路网':L.layerGroup([gaodeSat,gaodeLabel]), 'OSM街道':osm };
  gaodeSat.addTo(map);

  // ===== 位置持久化（2026-09-19 v60）=====
  // K_VIEW   上次视图（自动记忆）——保证「下次打开回到上次位置」
  // K_PLACES 用户显式「保存地点」的书签列表（可点击回跳、可删除）
  var K_VIEW='runye_map_view', K_PLACES='runye_map_places', K_Q='runye_map_lastq';
  function lsGet(k,d){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
  function tip(s){ document.getElementById('tip').textContent=s; }
  function curView(){ var c=map.getCenter(); return {lat:+c.lat.toFixed(6),lng:+c.lng.toFixed(6),zoom:map.getZoom()}; }
  function saveView(){ var v=curView(); v.ts=Date.now(); lsSet(K_VIEW,v); }

  // 打开时恢复上次位置（数据缺失/损坏则保持默认中心，不影响首次使用）
  (function(){
    var v=lsGet(K_VIEW,null);
    if(v && isFinite(v.lat) && isFinite(v.lng) && isFinite(v.zoom)){
      map.setView([v.lat,v.lng], Math.max(3,Math.min(19,v.zoom)));
      tip('已回到上次位置（'+v.lat.toFixed(4)+', '+v.lng.toFixed(4)+'）。');
    }
    var q=lsGet(K_Q,'');
    if(q) document.getElementById('search').value=q;
  })();
  // 视图变化即记忆（拖拽/缩放/定位都会触发 moveend）——下次打开据此恢复
  map.on('moveend', saveView);

  // 瓦片加载失败探测
  map.on('tileerror', function(){ document.getElementById('warn').style.display='block'; });

  // ===== 左侧工具栏宽度拖拽（2026-09-20）=====
  // 项目约定：没拖过不写任何变量——.side 宽度走 var(--mapSideW,250px) 回退，默认视觉逐像素不变；
  // 拖过才写内联变量 + localStorage 记忆；双击拖拽条恢复默认。拖动时 rAF 节流调 map.invalidateSize()。
  (function(){
    var side=document.querySelector('.side'), grip=document.getElementById('mapSideGrip');
    if(!side||!grip) return;
    var K_W='runye_map_side_w', MIN=180, MAX=520;
    function apply(w){
      side.style.setProperty('--mapSideW', w+'px');
      if(typeof map!=='undefined' && map && map.invalidateSize) map.invalidateSize();
    }
    var drag=null, raf=0, pendW=0;
    function frame(){ raf=0; if(drag) apply(pendW); }
    grip.addEventListener('pointerdown', function(e){
      e.preventDefault();
      drag={x:e.clientX, w:side.getBoundingClientRect().width};
      pendW=Math.round(drag.w);
      try{ grip.setPointerCapture(e.pointerId); }catch(err){}
      document.body.classList.add('side-resizing');
    });
    grip.addEventListener('pointermove', function(e){
      if(!drag) return;
      pendW=Math.max(MIN, Math.min(MAX, Math.round(drag.w + (e.clientX-drag.x))));
      if(!raf) raf=requestAnimationFrame(frame);
    });
    function endDrag(){
      if(!drag) return;
      drag=null;
      if(raf){ cancelAnimationFrame(raf); raf=0; }
      document.body.classList.remove('side-resizing');
      try{ localStorage.setItem(K_W, String(pendW)); }catch(err){}
    }
    grip.addEventListener('pointerup', endDrag);
    grip.addEventListener('pointercancel', endDrag);
    grip.addEventListener('dblclick', function(){
      side.style.removeProperty('--mapSideW');
      try{ localStorage.removeItem(K_W); }catch(err){}
      if(typeof map!=='undefined' && map && map.invalidateSize) map.invalidateSize();
    });
    // 恢复记忆宽度（有存档才写变量）
    try{
      var s=localStorage.getItem(K_W);
      if(s){ var w=parseInt(s,10); if(isFinite(w) && w>=MIN && w<=MAX) apply(w); }
    }catch(err){}
  })();

  // ===== 绘制逻辑 =====
  var drawing = false;
  var points = [];           // [{lat,lng}]
  var markers = [];          // L.marker
  var poly = null;           // L.polygon 实时
  var rubber = null;         // 橡皮筋线
  var latlngs = function(){ return points.map(function(p){return [p.lat,p.lng];}); };

  function toRad(d){ return d*Math.PI/180; }
  // 球面多边形面积（平方米）
  function geodesicArea(pts){
    if(pts.length<3) return 0;
    var R=6378137, area=0;
    for(var i=0;i<pts.length;i++){
      var p1=pts[i], p2=pts[(i+1)%pts.length];
      area += (toRad(p2.lng)-toRad(p1.lng))*(2+Math.sin(toRad(p1.lat))+Math.sin(toRad(p2.lat)));
    }
    return Math.abs(area*R*R/2);
  }
  // haversine 距离（米）
  function hav(a,b){
    var R=6378137, dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function perimeter(pts){
    if(pts.length<2) return 0;
    var s=0; for(var i=0;i<pts.length-1;i++) s+=hav(pts[i],pts[i+1]);
    if(pts.length>2) s+=hav(pts[pts.length-1],pts[0]); // 闭合
    return s;
  }

  function refresh(){
    // 更新多边形
    if(poly){ map.removeLayer(poly); poly=null; }
    if(points.length>=2){
      poly = L.polygon(latlngs(), {color:'#16a34a', weight:2, fillColor:'#22c55e', fillOpacity:0.25}).addTo(map);
    }
    // 数值
    var area = geodesicArea(points);
    document.getElementById('mu').textContent = (area/666.67).toLocaleString('zh-CN',{maximumFractionDigits:2});
    document.getElementById('ha').textContent = (area/10000).toLocaleString('zh-CN',{maximumFractionDigits:3});
    document.getElementById('sq').textContent = area.toLocaleString('zh-CN',{maximumFractionDigits:0});
    document.getElementById('peri').textContent = perimeter(points).toLocaleString('zh-CN',{maximumFractionDigits:0});
    document.getElementById('pts').textContent = points.length;
  }

  /* 顶点标识（2026-09-15 用户要求）：默认大头针太大，缩小到 60%（15×25），样式同默认蓝针 */
  function pinIcon(){
    return L.divIcon({
      className:'ry-pin',
      html:'<svg width="15" height="25" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5 0 21.9 12.5 41 12.5 41S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="#2a81cb" stroke="#fff" stroke-width="1.5"/><circle cx="12.5" cy="12.5" r="4" fill="#fff"/></svg>',
      iconSize:[15,25],iconAnchor:[7,24]
    });
  }

  function addPoint(lat,lng){
    var p={lat:lat,lng:lng};
    points.push(p);
    var idx=points.length-1;
    var m=L.marker([lat,lng],{draggable:true,icon:pinIcon(),keyboard:false});
    m.on('drag', function(e){
      var ll=e.target.getLatLng();
      points[idx]={lat:ll.lat,lng:ll.lng};
      if(rubber) map.removeLayer(rubber);
      refresh();
    });
    m.addTo(map);
    markers.push(m);
    refresh();
  }

  map.on('click', function(e){
    if(!drawing) return;
    addPoint(e.latlng.lat, e.latlng.lng);
  });
  map.on('mousemove', function(e){
    if(!drawing || points.length===0) return;
    if(rubber) map.removeLayer(rubber);
    var last=points[points.length-1];
    rubber=L.polyline([[last.lat,last.lng],[e.latlng.lat,e.latlng.lng]],{color:'#16a34a',weight:1,dashArray:'4,4',opacity:.7}).addTo(map);
  });
  map.on('mouseout', function(){ if(rubber){ map.removeLayer(rubber); rubber=null; } });

  // ===== 按钮 =====
  var btnDraw=document.getElementById('btnDraw');
  function setDrawing(on){
    drawing=on;
    btnDraw.classList.toggle('btn-on',drawing);
    map.getContainer().classList.toggle('drawing',drawing);
    if(drawing) map.dragging.disable(); else map.dragging.enable();
    btnDraw.textContent = drawing ? '✏️ 绘制中…' : '✏️ 开始画框';
    document.getElementById('tip').textContent = drawing
      ? '十字光标处即落点：依次点击地块边界顶点；拖动已有顶点可微调，点「完成」闭合。'
      : '点击「✏️ 开始画框」后，在卫星图上依次点击地块边界顶点即可。';
  }
  btnDraw.onclick=function(){ setDrawing(!drawing); };
  document.getElementById('btnFinish').onclick=function(){
    if(rubber){map.removeLayer(rubber);rubber=null;}
    refresh();
    if(drawing) setDrawing(false); // 闭合后退出绘制，恢复地图拖拽与缩放查看
  };
  document.getElementById('btnUndo').onclick=function(){
    if(points.length===0) return;
    points.pop();
    var m=markers.pop(); if(m) map.removeLayer(m);
    refresh();
  };
  document.getElementById('btnClear').onclick=function(){
    points=[]; markers.forEach(function(m){map.removeLayer(m);}); markers=[];
    if(poly){map.removeLayer(poly);poly=null;} if(rubber){map.removeLayer(rubber);rubber=null;}
    refresh();
  };

  // 底图切换
  var baseArr=['高德卫星','高德卫星+路网','OSM街道']; var baseIdx=0;
  document.getElementById('btnBase').onclick=function(){
    baseIdx=(baseIdx+1)%baseArr.length;
    map.removeLayer(baseLayers[baseArr[(baseIdx+2)%3]]);
    baseLayers[baseArr[baseIdx]].addTo(map);
    if(baseArr[baseIdx].indexOf('路网')>=0 && !map.hasLayer(gaodeLabel)){}
    this.textContent='底图:'+baseArr[baseIdx].replace('高德','');
  };

  // 定位三亚
  document.getElementById('btnLocate').onclick=function(){
    map.setView([18.2528,109.5119],15);
  };

  // ===== 地点搜索（2026-09-19 v60：多源兜底 + 候选点选）=====
  // 旧版只打 Nominatim 且无超时，国内常长时间无响应（表现为一直「搜索中…」）。
  // 现改为：主源 Photon（komoot，免 Key、国内可达、返回中文地名与 extent 包围盒），
  // 备源 Nominatim；单源 12s 超时逐个降级；全部失败时提示手动定位（手动定位同样可「保存地点」）。
  var searchSeq=0, lastPick=null;
  function fetchJson(url, ms){
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var t=setTimeout(function(){ if(ctl) ctl.abort(); }, ms||12000);
    var opt=ctl?{signal:ctl.signal}:{};
    return fetch(url,opt).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(j){ clearTimeout(t); return j; }, function(e){ clearTimeout(t); throw e; });
  }
  // extent 统一为 Leaflet bounds 形式 [[minLat,minLng],[maxLat,maxLng]]
  function normPhoton(j){
    var out=[];
    ((j&&j.features)||[]).forEach(function(f){
      var p=f.properties||{}, c=f.geometry&&f.geometry.coordinates;
      if(!p.name || !c || c.length<2) return;
      var det=[];
      [p.district,p.city,p.state,p.country].forEach(function(s){
        if(s && s!==p.name && det.indexOf(s)<0) det.push(s);
      });
      var e=p.extent, bnd=null;
      if(e && e.length===4) bnd=[[e[3],e[0]],[e[1],e[2]]];
      out.push({name:String(p.name), detail:det.join(' · '), lat:+c[1], lng:+c[0], extent:bnd});
    });
    return out.filter(function(r){ return isFinite(r.lat)&&isFinite(r.lng); });
  }
  function normNominatim(j){
    var out=[];
    (j||[]).forEach(function(r){
      var la=parseFloat(r.lat), lo=parseFloat(r.lon);
      if(!isFinite(la)||!isFinite(lo)) return;
      var nm=r.name||String(r.display_name||'').split(',')[0];
      var bb=r.boundingbox, bnd=null;
      if(bb && bb.length===4) bnd=[[+bb[0],+bb[2]],[+bb[1],+bb[3]]];
      out.push({name:nm, detail:String(r.display_name||''), lat:la, lng:lo, extent:bnd});
    });
    return out;
  }
  var resCache=[];
  function renderRes(list){
    resCache=list;
    var box=document.getElementById('searchRes');
    box.innerHTML='';
    if(!list.length){ box.hidden=true; return; }
    list.forEach(function(r,i){
      var b=document.createElement("button");
      b.type='button'; b.className='sr-item';
      b.setAttribute('data-sr-idx', String(i));
      var t=document.createElement("b"); t.textContent=r.name; b.appendChild(t);
      if(r.detail){ var d=document.createElement("i"); d.textContent=r.detail; b.appendChild(d); }
      b.title=r.name+(r.detail?' — '+r.detail:'');
      b.onclick=function(){ pick(r); };
      box.appendChild(b);
    });
    box.hidden=false;
  }
  var searchMark=null;
  function markSearch(r){
    if(searchMark){ map.removeLayer(searchMark); searchMark=null; }
    searchMark=L.marker([r.lat,r.lng],{icon:L.divIcon({
      className:'ry-pin', iconSize:[18,30], iconAnchor:[9,29],
      html:'<svg width="18" height="30" viewBox="0 0 25 41"><path d="M12.5 0C5.6 0 0 5.6 0 12.5 0 21.9 12.5 41 12.5 41S25 21.9 25 12.5C25 5.6 19.4 0 12.5 0z" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><circle cx="12.5" cy="12.5" r="4" fill="#fff"/></svg>'
    })}).addTo(map);
    searchMark.bindTooltip(r.name,{direction:'top'});
  }
  function goTo(r){
    if(r.extent){ map.fitBounds(r.extent,{padding:[20,20],maxZoom:16}); }
    else if(isFinite(r.zoom)){ map.setView([r.lat,r.lng], r.zoom); }
    else { map.setView([r.lat,r.lng], 16); }
    markSearch(r);
  }
  function pick(r){
    lastPick=r;
    goTo(r);
    document.getElementById('search').value=r.name;
    lsSet(K_Q,r.name);
    renderRes([]);
    tip('已定位：'+r.name+(r.detail?'（'+r.detail+'）':'')+'。点「💾 保存地点」可记住此处。');
  }
  // 坐标直入（免网络兜底）：支持「18.2528,109.5119」；首值 >90 时按「经度,纬度」理解
  function parseLatLng(q){
    var m=/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(q);
    if(!m) return null;
    var a=parseFloat(m[1]), b=parseFloat(m[2]), lat, lng;
    if(Math.abs(a)>90 && Math.abs(b)<=90){ lng=a; lat=b; } else { lat=a; lng=b; }
    if(Math.abs(lat)>90 || Math.abs(lng)>180) return null;
    return {lat:lat, lng:lng};
  }
  function doSearch(){
    var q=document.getElementById('search').value.trim();
    if(!q){ tip('请输入要搜索的地点名称，例如「三亚 崖州」。'); return; }
    lsSet(K_Q,q);
    // 坐标直入优先：不触网即可定位
    var ll=parseLatLng(q);
    if(ll){
      lastPick={name:q, detail:'坐标定位', lat:ll.lat, lng:ll.lng, zoom:16};
      goTo(lastPick);
      renderRes([]);
      tip('已按坐标定位：'+ll.lat+', '+ll.lng+'。点「💾 保存地点」可记住此处。');
      return;
    }
    lastPick=null;
    var seq=++searchSeq;
    renderRes([]);
    tip('搜索中…');
    /* 本地偏置：以当前地图中心为参照，重名地名优先命中本地（实测「东方市」→ 19.0979,108.6482 海南） */
    var cc=map.getCenter();
    var bias='&lat='+(+cc.lat.toFixed(5))+'&lon='+(+cc.lng.toFixed(5))+'&zoom=8';
    var srcs=[
      {url:'https://photon.komoot.io/api/?limit=6'+bias+'&q='+encodeURIComponent(q), norm:normPhoton},
      /* 备源必须限中国：实测不限国家时「东方市」首条命中巴拉圭同名地（-25.5,-54.6） */
      {url:'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=cn&accept-language=zh&q='+encodeURIComponent(q), norm:normNominatim}
    ];
    (function next(i){
      if(seq!==searchSeq) return;
      if(i>=srcs.length){ tip('搜索服务暂不可用或未找到结果；可手动拖拽/缩放定位后点「💾 保存地点」。'); return; }
      fetchJson(srcs[i].url, 12000).then(function(j){
        if(seq!==searchSeq) return;
        var rs=srcs[i].norm(j);
        if(!rs.length) return next(i+1);
        renderRes(rs);
        tip('找到 '+rs.length+' 个候选地点，点选即定位。');
      }).catch(function(){ if(seq===searchSeq) next(i+1); });
    })(0);
  }
  document.getElementById('btnSearch').onclick=doSearch;
  document.getElementById('search').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });

  // ===== 保存地点（书签）=====
  function renderPlaces(){
    var arr=lsGet(K_PLACES,[])||[];
    var box=document.getElementById('placeList');
    box.innerHTML='';
    arr.forEach(function(p){
      var row=document.createElement("div"); row.className="place-item";
      row.setAttribute('data-place-id', p.id);
      var go=document.createElement("button");
      go.type='button'; go.className='place-go'; go.setAttribute('data-place-go','1');
      go.textContent='📍 '+p.name; go.title=p.name;
      go.onclick=function(){
        lastPick={name:p.name,detail:'',lat:p.lat,lng:p.lng,zoom:p.zoom};
        goTo(lastPick);
        document.getElementById('search').value=p.name;
        lsSet(K_Q,p.name);
        tip('已回到保存的地点：'+p.name+'。');
      };
      var del=document.createElement("button");
      del.type='button'; del.className='place-del'; del.setAttribute('data-place-del','1');
      del.textContent='×'; del.title='删除该地点';
      del.setAttribute('aria-label','删除地点 '+p.name);
      del.onclick=function(){
        var now=(lsGet(K_PLACES,[])||[]).filter(function(x){ return x.id!==p.id; });
        lsSet(K_PLACES, now);
        renderPlaces();
        tip('已删除地点：'+p.name+'。');
      };
      row.appendChild(go); row.appendChild(del); box.appendChild(row);
    });
    box.hidden = arr.length===0;
  }
  document.getElementById('btnSavePlace').onclick=function(){
    var v=curView();
    var nm=(lastPick && lastPick.name) || document.getElementById('search').value.trim() || '';
    var arr=lsGet(K_PLACES,[])||[];
    if(!nm) nm='地点 '+(arr.length+1);
    var hit=null;
    for(var i=0;i<arr.length;i++){ if(arr[i].name===nm){ hit=arr[i]; break; } }
    if(hit){ hit.lat=v.lat; hit.lng=v.lng; hit.zoom=v.zoom; hit.ts=Date.now(); }
    else{
      arr.push({id:'mp'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e4).toString(36),
        name:nm, lat:v.lat, lng:v.lng, zoom:v.zoom, ts:Date.now()});
      if(arr.length>20) arr=arr.slice(arr.length-20);
    }
    lsSet(K_PLACES,arr);
    saveView();
    renderPlaces();
    tip('已保存地点：'+nm+'（'+v.lat.toFixed(4)+', '+v.lng.toFixed(4)+'）——下次打开会回到这里。');
  };
  renderPlaces();

  // 回传设计工具：写入 localStorage，并跳转到 index.html 的面积测量工具（03 面积测量工具）
  document.getElementById('btnCopy').onclick=function(){
    var mu=parseFloat((geodesicArea(points)/666.67).toFixed(2));
    if(!mu){ alert('请先画框测量出面积'); return; }
    var sqm=Math.round(geodesicArea(points));
    try{
      var pid='pm'+Date.now();
      var nm='';
      localStorage.setItem('runyeMeasuredArea', JSON.stringify({plotId:pid, name:nm, mu:mu, sqm:sqm, poly:latlngs(), ts:Date.now(), source:'map'}));
      var btn=document.getElementById('btnCopy');
      btn.textContent='回传中…';
      setTimeout(function(){ window.location.href='index.html#areaTool'; }, 350);
    }catch(e){ alert('写入失败：'+e.message); }
  };

  // 保存到地块库（与精准灌溉页共用 localStorage['runye_plot_library']），可累计多个地块
  document.getElementById('btnSavePlot').onclick=function(){
    var mu=parseFloat((geodesicArea(points)/666.67).toFixed(2));
    if(!mu){ alert('请先在地图上画框测量出面积再保存'); return; }
    var sqm=Math.round(geodesicArea(points));
    var name='';
    var arr=[]; try{ arr=JSON.parse(localStorage.getItem('runye_plot_library')||'[]'); }catch(e){ arr=[]; }
    if(!name) name='地块 '+(arr.length+1);
    // 经纬度 → 本地米坐标（与精准灌溉页 applyMapMeasuredArea 一致），便于「设为当前」回填
    var poly=latlngs(), xs=[], ys=[];
    if(poly && poly.length>=3){
      var lats=poly.map(function(p){return p[0];}), lngs=poly.map(function(p){return p[1];});
      var clat=lats.reduce(function(a,b){return a+b;},0)/lats.length;
      var R=6378137, mlat=R*Math.PI/180, cosLat=Math.cos(clat*Math.PI/180);
      poly.forEach(function(p){ xs.push((p[1]-lngs[0])*mlat*cosLat); ys.push((p[0]-clat)*mlat); });
    }
    var plot={ id:'p'+Date.now()+Math.floor(Math.random()*1000), name:name, mu:mu, sqm:sqm,
      poly:xs.map(function(x,i){return {x:Math.round(x*100)/100,y:Math.round(ys[i]*100)/100};}),
      crop:'七彩花生', source:'map', ts:Date.now(), note:'' };
    arr.push(plot);
    try{ localStorage.setItem('runye_plot_library', JSON.stringify(arr)); }catch(e){ alert('保存失败：'+e.message); return; }
    alert('已保存到地块库：'+name+'（'+mu+' 亩）\n可在精准灌溉页「地块库」设为当前，或在数字农业页选择。');
  };

  refresh();
})();
</script>
</body>
</html>
