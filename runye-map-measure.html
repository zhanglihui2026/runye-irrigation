<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>润野 · 地图面积测量（在线卫星图 · 免Key）</title>
<script>if(window.self!==window.top)document.documentElement.classList.add('ry-embedded-page');</script>
<link rel="stylesheet" href="pwa/vendor/leaflet.css" />
<style>
  :root{
    /* [v490 简化] 本页局部变量别名。--s-200/--s-600 全页零引用已删；
       --radius 仅 .tip/.warn 共用，保留单一出处。
       ★ 字号统一出处 = runye-typography.css（button/input/select 一律 13px !important），
         页内自 v490 起不再给 button/input/select 写 font-size（写了也会被压死，白留死码）。 */
    --g-700:var(--ry-green-700); --g-600:var(--ry-green-600); --g-500:var(--ry-green-500); --g-50:var(--ry-green-50);
    --g-100:var(--ry-green-100); --s-700:var(--ry-s-700); --s-500:var(--ry-s-500); --s-300:var(--ry-s-300); --s-100:var(--ry-s-100);
    --radius:0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;color:var(--s-700);background:#f7f5f0}
  #app{display:flex;flex-direction:column;height:100vh}
  /* ===== 顶部功能区导航（2026-09-13 去重）=====
     皮肤 = runye-nav.css（唯一出处）；按钮清单 = runye-nav.js（唯一出处，
     与主页同一份 ITEMS —— 主页隐藏的「管网布置/数据对比」不在清单）。
     本页只保留布局差异：导航条吸顶 + .fn-inner 整幅排布。 */
  .fn-nav{position:sticky;top:0;z-index:1200;flex:none}
  /* 主程序 iframe 已提供全站主导航，嵌入时隐藏本页独立导航，避免出现第二条。 */
  html.ry-embedded-page .fn-nav{display:none!important}
  .fn-nav .fn-inner{padding:0 12px}
  @media(max-width:768px){
    .fn-nav .fn-inner{padding:0 16px}
  }
  /* 主体：左侧工具栏 + 地图（2026-09-13 改版：原绿色顶部操作条与右侧浮动测量面板
     的全部内容集中到左侧工具栏，地图占满其余空间）
     [v490 简化] 右边框原写两处（此处 s-300 + 块尾 v322 的 transparent 覆盖），
     自冲突合并为一处：左边框实际渲染一直是透明（左栏与画布直接相接）。 */
  .main{flex:1;position:relative;display:flex;min-height:0}
  .side{flex:none;width:var(--mapSideW,250px);background:#fff;border-right:1px solid transparent;
    overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
  /* 细滚动条（2026-09-20）：只写 ::-webkit-scrollbar，不写 scrollbar-width/color
     标准属性——两者并存会让 webkit 伪元素整条失效，实测回退 11px 标准条（第六十五轮） */
  .side::-webkit-scrollbar,.sr-list::-webkit-scrollbar{width:5px;height:5px}
  .side::-webkit-scrollbar-track,.sr-list::-webkit-scrollbar-track{background:transparent}
  .side::-webkit-scrollbar-thumb,.sr-list::-webkit-scrollbar-thumb{background:rgba(188,211,198,.25);border-radius:2px}
  .side::-webkit-scrollbar-thumb:hover,.sr-list::-webkit-scrollbar-thumb:hover{background:#9db8a7}
  /* 左侧工具栏宽度拖拽条（2026-09-20）：拖动写 --mapSideW + localStorage 记忆，双击恢复默认；
     没拖过不写任何变量，默认宽度 250px 逐像素不变 */
  .side-grip{flex:none;width:6px;cursor:col-resize;background:transparent;touch-action:none;position:relative;z-index:5}
  .side-grip:hover,.side-grip:active{background:var(--g-100)}
  body.side-resizing{cursor:col-resize!important;user-select:none!important}
  .side section{flex:none}
  .sec-t{margin:0 0 5px;font-size:11px;color:var(--s-500);font-weight:700;letter-spacing:1px;
    border-left:3px solid var(--g-600);padding-left:8px;line-height:1.4}
  .tools{display:flex;flex-direction:column;gap:5px}
  /* [v490] input/button/select 字号统一由 runye-typography.css 出（13px !important），
     页内 font-size 声明均被压死已删；font:inherit 保留（继承链同为 13px，等价） */
  .side input[type=text]{height:34px;padding:0 7px;border:1px solid var(--s-300);width:100%;
    background:#fff;color:var(--s-700)}
  .side input[type=text]:focus{outline:1px solid var(--g-600)}
  .mbtn{height:34px;padding:0 9px;border:1px solid var(--s-300);background:#fff;color:var(--s-700);
    cursor:pointer;font-weight:600;text-align:left;font-family:inherit}
  .mbtn:hover{border-color:var(--g-600);color:var(--g-700);background:var(--g-50)}
  .mbtn.btn-on{background:var(--g-500);color:#fff;border-color:var(--g-500)}
  /* [v497-map-side-font] 左栏文字缩小（与主程序内嵌版 mod/online-map.css 同步改，v495 教训）：
     按钮/输入框 13px→11px、高度 34→28px；栏目标题 11→10px。
     specificity(.side .mbtn=0,2,0) > typography.css 的 button:where(=0,0,1)，同载 !important 时前者胜。 */
  .side .mbtn{font-size:11px !important;height:28px !important}
  .side input[type=text]{font-size:11px !important;height:28px !important}
  .side .sec-t{font-size:10px !important}
  .mbtn-primary{background:var(--g-600);color:#fff;border-color:var(--g-600);text-align:center}
  .mbtn-primary:hover{background:var(--g-700);color:#fff}
  .search-row{display:flex;gap:6px}
  .search-row input{flex:1;min-width:0}
  .search-row .mbtn{flex:none;text-align:center}
  /* 搜索结果候选 + 已保存地点（2026-09-19 v60：地点搜索 / 保存地点 / 位置记忆） */
  .sr-list{margin-top:5px;border:1px solid var(--s-300);background:#fff;max-height:158px;overflow-y:auto}
  .sr-list[hidden]{display:none}
  .sr-item{display:block;width:100%;border:0;border-bottom:1px solid var(--s-100);background:#fff;
    text-align:left;padding:5px 7px;font:inherit;line-height:1.35;color:var(--s-700);cursor:pointer}
  .sr-item:last-child{border-bottom:0}
  .sr-item:hover{background:var(--g-50);color:var(--g-700)}
  .sr-item b{display:block;font-weight:600;color:inherit}
  .sr-item i{font-style:normal;display:block;font-size:10px;color:var(--s-500);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill-list{margin-top:5px;display:flex;flex-direction:column;gap:4px}
  .pill-list[hidden]{display:none}
  .place-item{display:flex;gap:4px;align-items:center}
  .place-go{flex:1 1 auto;min-width:0;height:26px;padding:0 6px;border:1px solid var(--s-300);background:#fff;
    color:var(--s-700);font:inherit;text-align:left;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .place-go:hover{border-color:var(--g-600);color:var(--g-700);background:var(--g-50)}
  .place-del{flex:none;width:26px;height:26px;border:1px solid var(--s-300);background:#fff;color:var(--s-500);
    font:inherit;line-height:1;cursor:pointer}
  .place-del:hover{border-color:var(--ry-danger);color:var(--ry-danger);background:#fef2f2}
  /* [v191 2026-10-03] 「→ 回传二级管路」按钮：把**这条地块记录**（含成组地块）传给地块绘制 */
  .place-send{flex:none;width:30px;height:26px;border:1px solid var(--g-600);background:var(--g-50);color:var(--g-700);
    font:inherit;line-height:1;cursor:pointer;border-radius:3px}
  .place-send:hover{background:var(--g-600);color:#fff}
  /* 测量结果 */
  .results .row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;border-bottom:1px dashed var(--s-100)}
  .results .row .k{font-size:11px;color:var(--s-500)}
  .results .row .v{font-size:13px;font-weight:700;color:var(--g-700)}
  .results .row .v small{font-size:10px;color:var(--s-500);font-weight:400;margin-left:2px}
  .hint{font-size:10px;color:var(--s-500);margin-top:5px;line-height:1.4}
  .results .mbtn-primary{margin-top:6px;width:100%}
  .save-row{margin-top:5px;display:flex;gap:6px;align-items:center;justify-content:stretch}
  .save-row .mbtn{flex:1 1 0;min-width:0;white-space:nowrap;padding-left:4px;padding-right:4px}
  .ry-pin{background:transparent;border:none}
  /* 地图 */
  .map-wrap{flex:1;position:relative;min-width:0}
  /* ===== [v494] 地图绘制工具条：左栏「绘制」区迁来，地图区顶端的可拖动横条 =====
     形态：白底细描边横排、直角（全站扁平化）、按钮 28px 高；
     拖动/位置记忆 = mod/ry-panel.js rypDraggable（bounds=.map-wrap，拖不出地图区）；
     左栏已无「绘制」区。撤功能：删 #mapDrawTools + 本段样式 + 左栏注释即可。 */
  .map-draw-tools{position:absolute;left:12px;top:12px;z-index:1050;display:flex;align-items:center;
    gap:4px;flex-wrap:wrap;max-width:calc(100% - 24px);padding:4px 6px;
    background:#fff;border:1px solid var(--s-300);box-shadow:0 2px 8px rgba(15,23,42,.14)}
  .map-draw-tools .dt-grip{flex:none;padding:4px 7px;font-size:12px;font-weight:700;color:var(--g-700);
    background:var(--g-50);border-right:1px solid var(--s-300);cursor:move;user-select:none;touch-action:none;letter-spacing:1px}
  .map-draw-tools .mbtn{height:28px;padding:0 8px;font-size:12px;border-width:1px;background:#fff}
  .map-draw-tools .mbtn:hover{border-color:var(--g-600);color:var(--g-700);background:var(--g-50)}
  .map-draw-tools .mbtn.btn-on{background:var(--g-500);color:#fff;border-color:var(--g-500)}
  /* ===== [v283 2026-10-06] 「回传地块绘制 / 保存地块」并入右侧「分区角度」悬浮面板**内部顶端**
     （用户截图指定：放在这个面板里面、且在「当前设计地块」下拉之上）。
     v282 曾让它们浮在地图左上角，本轮撤掉那个绝对定位容器 ⇒ 恢复为面板内正常流
     （position:static），button 的 id 与 JS 绑定依然零改动。 */
  .map-float-actions{display:flex;flex-direction:column;gap:5px}
  .map-float-actions .mbtn{height:28px;padding:0 8px;text-align:center;font-weight:700;
    border:1px solid var(--g-600);background:#fff;color:var(--g-700);border-radius:4px}
  .map-float-actions .mbtn:hover{background:var(--g-50);color:var(--g-700)}
  .map-float-actions .mbtn-primary{background:var(--g-600);color:#fff}
  .map-float-actions .mbtn-primary:hover{background:var(--g-700);color:#fff}
  /* ===== [v282] 分区角度悬浮面板：形态仿手机端 runye-mobile-map-preview.html 的
     .map-angle（↶＋1° / 角度输入 / ↷−1° 竖排）；默认靠地图区右侧，标题栏可拖动，位置记忆。 */
  .ry-angle-panel{position:absolute;right:12px;top:96px;z-index:1150;width:150px;
    background:var(--ry-panel-bg,#fff);border:1px solid var(--ry-panel-border,var(--ry-green-600));border-radius:6px;
    box-shadow:0 3px 12px rgba(15,23,42,.25);overflow:hidden;font-size:12px}
  .ry-angle-head{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--ry-panel-head-bg,var(--ry-green-600));
    color:#fff;cursor:move;user-select:none;touch-action:none;font-size:12px;font-weight:700;line-height:1.2}
  .ry-angle-head .ah-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ry-angle-head .ah-fold{flex:none;width:20px;height:20px;border:0;background:transparent;color:#fff;
    font:inherit;line-height:1;cursor:pointer;padding:0}
  .ry-angle-body{padding:7px;display:flex;flex-direction:column;gap:6px}
  .ry-angle-panel.folded .ry-angle-body{display:none}
  #mapPartitionTools select{width:100%;height:28px;font-family:inherit;
    border:1px solid var(--s-300);background:#fff;color:var(--s-700);padding:0 4px}
  /* 竖排角度组：↶＋1° 上 / 角度输入中 / ↷−1° 下（与手机端 .map-angle 同形态） */
  .map-angle-row{display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .map-angle-row .ang-btn{height:28px;display:flex;align-items:center;justify-content:center;gap:4px;
    padding:0 6px;font:inherit;border:1px solid var(--s-300);background:#fff;
    color:var(--s-700);cursor:pointer}
  .map-angle-row .ang-btn:hover{border-color:var(--ry-green-600);color:var(--ry-green-700);background:var(--ry-green-50)}
  .map-angle-row .ang-btn small{font-size:10px;font-weight:600}
  .map-angle-value{display:flex;align-items:center;gap:3px;justify-content:center}
  .map-angle-value input{width:100%;min-width:0;height:28px;text-align:center;font:inherit;
    font-weight:700;color:var(--ry-green-700);border:1px solid var(--s-300);background:#fff}
  .map-angle-value input:focus{outline:1px solid var(--ry-green-600)}
  .map-angle-value span{font-size:12px;color:var(--s-500);font-weight:600}
  .ry-angle-panel .save-row{margin-top:0;display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .ry-angle-panel .save-row .mbtn{height:28px;font-weight:700;padding:0 4px;text-align:center;flex:none}
  .ry-angle-panel .hint{margin-top:2px;font-size:10px;line-height:1.35}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;background:#dfe6e9}
  /* 操作提示条 */
  .tip{position:absolute;left:14px;bottom:14px;background:rgba(15,23,42,.82);color:#fff;padding:8px 14px;font-size:12px;z-index:1000;border-radius:var(--radius);max-width:60%}
  /* 加载失败提示 */
  .warn{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fef3c7;color:#92400e;
    border:1px solid #f59e0b;padding:8px 14px;font-size:12px;z-index:1100;border-radius:var(--radius);display:none}
  /* 实时面积框（2026-09-28）：白底橙边常驻标签；pointer-events:none 不挡绘制点击 */
  .ry-area-tip{background:rgba(255,255,255,.96);border:1.5px solid #ff6b00;border-radius:8px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);padding:5px 10px;pointer-events:none}
  .ry-area-tip .ab-t{font-size:14px;font-weight:800;color:#ea580c;white-space:nowrap}
  .ry-area-tip .ab-s{font-size:11px;font-weight:600;color:var(--ry-s-500);margin-top:1px;white-space:nowrap}
  /* 绘制模式：高对比十字光标，替代地图拖动手型，避免点错位 */
  .leaflet-container.drawing{ cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2730%27%20height%3D%2730%27%3E%3Cg%20stroke%3D%27black%27%20stroke-width%3D%273%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27white%27%20stroke-width%3D%271.5%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2715%27%20cy%3D%2715%27%20r%3D%272.5%27%20fill%3D%27white%27%20stroke%3D%27black%27%20stroke-width%3D%271%27%2F%3E%3C%2Fsvg%3E") 15 15, crosshair !important; }
  .leaflet-container.drawing .leaflet-grab{ cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2730%27%20height%3D%2730%27%3E%3Cg%20stroke%3D%27black%27%20stroke-width%3D%273%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Cg%20stroke%3D%27white%27%20stroke-width%3D%271.5%27%3E%3Cline%20x1%3D%2715%27%20y1%3D%273%27%20x2%3D%2715%27%20y2%3D%2712%27%2F%3E%3Cline%20x1%3D%2715%27%20y1%3D%2718%27%20x2%3D%2715%27%20y2%3D%2727%27%2F%3E%3Cline%20x1%3D%273%27%20y1%3D%2715%27%20x2%3D%2712%27%20y2%3D%2715%27%2F%3E%3Cline%20x1%3D%2718%27%20y1%3D%2715%27%20x2%3D%2727%27%20y2%3D%2715%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2715%27%20cy%3D%2715%27%20r%3D%272.5%27%20fill%3D%27white%27%20stroke%3D%27black%27%20stroke-width%3D%271%27%2F%3E%3C%2Fsvg%3E") 15 15, crosshair !important; }
  /* [v150 2026-09-29] 绘制期间叠加层不抢点击。
   * 地块/管网叠加层是 interactive path（带 popup），它们会把 Map 的 click 拦在自己身上
   * （Leaflet 1.9.4 _findEventTargets 命中图层后不再补上 map），于是「在地块范围内点顶点没反应」。
   * 实测不隔离时 4 次点击只登记 3 个顶点 —— 用户点出来的框自然与他以为点的位置不一致。
   * 标点在 marker-pane，不受本规则影响 ⇒ 绘制中仍可拖动已有顶点微调。 */
  .leaflet-container.drawing .leaflet-overlay-pane path{ pointer-events:none !important; }
  /* 窄屏：左侧工具栏转为顶部横条（纵向滚动），地图仍占满剩余空间 */
  @media(max-width:700px){
    .main{flex-direction:column}
    .side{width:100%;max-height:46vh;border-right:0;border-bottom:1px solid var(--s-300)}
    .side-grip{display:none}
  }
/* ===== RY-NAV 区块已整体取消（2026-09-12）：原 .ry-nav 品牌导航栏的 50 行样式
   （.main-header/.header-inner/.brand/.main-nav/.nav-link/.nav-home-btn/.search-btn/
   .mobile-menu-btn 及 @media(max-width:768px) 手机端规则）已一并删除。
   2026-09-13 起页面顶部改为「功能区导航 .fn-nav + 左侧工具栏 .side」结构。
   恢复原值：git show HEAD:runye-map-measure.html ===== */
  /* ===== [v490 简化] 原 v322 全局滚动条段（*::-webkit-scrollbar-track/thumb/hover/corner）
     与「.side{border-right-color:transparent}」已删除，理由（单一出处）：
     ① 全站滚动条唯一出处 = runye-theme.css v383（4px 圆角灰丸、轨道透明、藏箭头按钮），
        本页 v322 同特异性规则加载在 theme 之前，四条声明全部被压死，属死码；
     ② 左栏与 .sr-list 的局部 5px 绿拇指（本块上方 ::-webkit-scrollbar 专属规则，
        特异性更高）不受影响，继续生效；
     ③ .side 右边框透明已并入上方 .side 主规则（border-right:1px solid transparent）。 */
</style>

<!-- PWA: independent installation and offline support -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15803d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="润野灌溉">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="pwa/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="pwa/icons/icon-192.png">
<link rel="stylesheet" href="pwa/pwa.css?v=2">
<script defer src="pwa/pwa.js?v=2"></script>
    <link rel="stylesheet" href="runye-theme.css?v=2">
    <link rel="stylesheet" href="mod/ry-panel.css?v=1">
  <link rel="stylesheet" href="runye-typography.css?v=1">
</head>
<body>
<div id="app">
  <!-- 顶部功能区导航（2026-09-13 去重）：皮肤 = runye-nav.css、按钮清单 = runye-nav.js
       （与主页同一份 ITEMS —— 主页隐藏的「管网布置/数据对比」不在清单，两页按钮集一致）；
       当前页「在线地图」由 runye-nav.js 自动高亮；v302 品牌字 .side-brand 已按用户要求取消 -->
  <nav class="fn-nav" aria-label="功能区导航">
    <div class="fn-inner" data-ry-fnnav data-base="index.html#"></div>
  </nav>
  <script src="runye-nav.js?v=385-global-open"></script>
  <!-- [NEW MODULE: map-enhance] 实景叠加图层（2026-09-26）：删除下两行即卸载，不影响其他逻辑 -->
  <script src="runye-geo.js"></script>
  <script src="core/irrigation-data-store.js?v=1"></script>
  <script src="core/plot-library-store.js?v=508-project-import-safe-rollback"></script>
  <script src="runye-map-enhance.js?v=505-map-plot-store-cas"></script>
<script src="runye-map-partition.js?v=499-partition-inner"></script>
  <!-- [NEW MODULE: pipe_optim] 导航按钮与主页同源（2026-09-23 用户要求：三页导航一致） -->
  <script src="pipe_optim_ui.js"></script>
  <div class="main">
    <!-- 左侧工具栏：原绿色顶部操作条（搜索/定位/底图/画框四键）+ 右侧浮动「测量结果」面板
         的全部内容集中于此（2026-09-13）。全部元素 id 未变，JS 逻辑零改动 -->
    <aside class="side">
      <section>
        <h4 class="sec-t">地图</h4>
        <div class="tools">
          <div class="search-row">
            <input type="text" id="search" placeholder="搜索地点（如：三亚 崖州）" />
            <button class="mbtn" id="btnSearch">搜索</button>
            <button class="mbtn" id="btnSavePlace">保存地点</button>
          </div>
          <div class="sr-list" id="searchRes" hidden></div>
          <div class="pill-list" id="placeList" hidden></div>
          <button class="mbtn" id="btnLocate">📍 定位三亚</button>
          <button class="mbtn" id="btnBase">🗺️ 切换底图</button>
          <div class="hint" id="placeHint">搜索定位后可「保存地点」；地图位置自动记住，下次打开回到上次位置。也可直接输入坐标（如 18.2528,109.5119）定位。</div>
        </div>
      </section>
      <!-- [v494 用户要求] 原「绘制」区（开始画框/完成并画下一块/加点/撤销/测距/清除）
           整体迁出左栏 → 地图区顶端的可拖动工具条 #mapDrawTools（位置记忆，
           拖不出地图区 = 永不超过导航栏）。按钮 id 全部不变，online-map.js 零改动。
           恢复：删 .map-wrap 内 #mapDrawTools，把下面注释里的 6 个按钮搬回此处。 -->
      <section class="results">
        <h4 class="sec-t">测量结果</h4>
        <div class="row"><span class="k">面积</span><span class="v"><span id="mu">0</span><small>亩</small></span></div>
        <div class="row"><span class="k">折合</span><span class="v"><span id="ha">0</span><small>公顷</small></span></div>
        <div class="row"><span class="k">平方</span><span class="v"><span id="sq">0</span><small>㎡</small></span></div>
        <div class="row"><span class="k">周长</span><span class="v"><span id="peri">0</span><small>m</small></span></div>
        <div class="row"><span class="k">顶点</span><span class="v"><span id="pts">0</span><small>个</small></span></div>
        <div class="save-row">
          <button class="mbtn" id="btnGeoJSON">⬇ GeoJSON</button>
          <button class="mbtn" id="btnKML">⬇ KML</button>
        </div>
        <div class="save-row">
          <button class="mbtn" id="btnImport">⬆ 导入地块(GeoJSON/KML/KMZ/奥维轨迹)</button>
        </div>
        <input type="file" id="fileImport" accept=".geojson,.json,.kml,.ovkml,.kmz" style="display:none" />
        <div class="hint">保存后可累计多个地块；在「精准灌溉」页的地块库中可将任一地块设为当前。</div>
      </section>
      <section>
        <h4 class="sec-t">我的地块</h4>
        <div class="pill-list" id="myPlotList" hidden></div>
        <div class="hint" id="myPlotHint">保存/导入后的地块列在这里；点击飞到该地块，×删除。</div>
        <!-- [v185/v189 2026-10-03] 多地块成组：勾选若干相邻小地块 → 编为一组便于一起操作。
             ★ 语义：只成组、不改几何；各块轮廓与块间道路/间隔/水渠/空地**原样保留**。
             成组后可直接「回传地块绘制」把**各子地块**（而不是合并后的大块）
             传给二级管路页面；各子地块可分别布管，再用总管互连。 -->
        <div class="save-row">
          <button class="mbtn" id="btnMerge">🔗 地块成组</button>
          <button class="mbtn" id="btnMergeExit" hidden>✓ 完成成组</button>
        </div>
        <div class="hint" id="mergeHint" hidden></div>
        <div class="save-row">
          <button class="mbtn" id="btnExportProj">💾 导出工程</button>
          <button class="mbtn" id="btnImportProj">📂 导入工程</button>
        </div>
        <input type="file" id="fileProj" accept=".json,.runye.json" style="display:none" />
      </section>
    </aside>
    <!-- 左侧工具栏宽度拖拽条（2026-09-20）：拖动调宽、双击恢复默认 -->
    <div class="side-grip" id="mapSideGrip" title="拖动调节工具栏宽度；双击恢复默认"></div>
    <div class="map-wrap">
      <div id="map"></div>
      <!-- ===== [v494 用户要求] 地图绘制工具条：左栏「绘制」区整体迁来，挂在地图区顶端；
           按住左侧「⠿ 绘制」抓手可拖动（复用 mod/ry-panel.js rypDraggable：位置记忆
           localStorage['mapDrawToolsPos']，clamp 在 .map-wrap 内 = 永不超出地图区、
           不超过导航栏）。按钮 id 不变，online-map.js 绑定零改动。 ===== -->
      <div class="map-draw-tools ryp-float" id="mapDrawTools" data-ry-panel
           data-ry-position-key="mapDrawToolsPos" data-ry-default-top="12" data-ry-default-left="12">
        <span class="dt-grip" data-ry-drag title="按住拖动工具条；位置自动记住">⠿ 绘制</span>
        <button class="mbtn" id="btnDraw">✏️ 开始画框</button>
        <!-- [v186] 「完成」的语义已升级为「定稿本块 + 清空 + 继续画下一块」，
             按钮文案随之改，让用户一眼知道点完还能接着画（见 btnFinish 处理函数）。 -->
        <button class="mbtn" id="btnFinish">✅ 完成并画下一块</button>
        <button class="mbtn" id="btnAddPt">➕ 加点</button>
        <button class="mbtn" id="btnUndo">↩ 撤销</button>
        <button class="mbtn" id="btnMeasure">📏 测距</button>
        <button class="mbtn" id="btnClear">🗑 清除</button>
      </div>
      <!-- ===== [v282] 分区角度悬浮面板 =====
           形态仿手机端 runye-mobile-map-preview.html 的 .map-angle：↶＋1° / 角度输入 / ↷−1° 竖排。
           原「分区角度」那一节（id=mapPartitionTools）整体迁入（runye-map-partition.js 只按 id 取 box，
           再用 querySelector 取内部 select / input / [role=status] / [data-angle-*]，
           故「搬容器不改结构」= JS 逻辑零改动）。默认靠地图区右侧，标题栏可拖动，位置记忆。 -->
      <div class="ry-angle-panel ryp-float" id="ryAnglePanel" data-ry-panel data-ry-drag-bounds data-ry-position-key="ryAnglePanelPos" data-ry-position-legacy-key="ryAnglePanelPos" data-ry-fold-key="ryAnglePanelFolded" data-ry-fold-legacy-key="ryAnglePanelFolded" data-ry-default-top="96">
        <div class="ry-angle-head ryp-titlebar" id="ryAngleHead" data-ry-drag title="按住这里可拖动面板">
          <span class="ah-t ryp-title">分区角度</span>
          <button class="ah-fold ryp-fold" id="ryAngleFold" type="button" data-ry-fold aria-label="折叠或展开分区角度面板" aria-expanded="true" data-ry-fold-open="▾" data-ry-fold-closed="▸" title="折叠/展开">▾</button>
        </div>
        <div class="ry-angle-body ryp-body" data-ry-body>
          <!-- [v283 2026-10-06] 「↩ 回传地块绘制」「💾 保存地块」：用户截图指定放在**本面板内部顶端**、
               「当前设计地块」下拉之上（v282 曾浮在地图左上角）。button id 与 JS 绑定仍零改动。
               ★ 必须留在 section#mapPartitionTools **之外** —— 该 section 是分区角度模块
                 按 id 取的盒子，往里塞无关按钮会改变其 querySelector('input') 的落点语义。 -->
          <div class="map-float-actions" id="mapFloatActions">
            <button class="mbtn mbtn-primary" id="btnCopy">回传地块绘制</button>
            <!-- [NEW MODULE: 地形模块 v286d] 回传地形模块：卸载=删除本行 + sendPlotToTerrain/btnCopyTerrain 那两段 JS -->
            <button class="mbtn" id="btnCopyTerrain">回传地形模块</button>
            <button class="mbtn mbtn-primary" id="btnSavePlot">💾 保存地块</button>
          </div>
          <section id="mapPartitionTools">
            <select aria-label="选择分区地块"></select>
            <div class="map-angle-row">
              <button class="ang-btn" type="button" data-angle-plus title="增加1°">↶<small>＋1°</small></button>
              <div class="map-angle-value"><input aria-label="地图分区角度" type="number" min="-180" max="180" step="1" value="0"><span>°</span></div>
              <button class="ang-btn" type="button" data-angle-minus title="减少1°">↷<small>－1°</small></button>
            </div>
            <div class="save-row"><button class="mbtn mbtn-primary" data-angle-apply>应用并重新划分</button><button class="mbtn" data-angle-send>回二级继续规划</button></div>
            <p class="hint" role="status">只调整分区方向，地块边界不动。正角度从东向北旋转。</p>
          </section>
        </div>
      </div>
      <div class="warn" id="warn">⚠️ 地图瓦片加载失败，请检查网络（本工具需要联网获取卫星影像）。</div>
      <div class="tip" id="tip">点击「✏️ 开始画框」后，在卫星图上依次点击地块边界顶点即可。</div>
    </div>
  </div>
</div>

<script src="pwa/vendor/leaflet.js"></script>
<script src="mod/online-map.js?v=508-project-import-safe-rollback"></script>
<script src="mod/ry-panel.js?v=494-drag-default-left"></script>
</body>
</html>
