<script>
var DEFAULTS = {
  title: '润野灌溉 — 供水首部系统图（二级）', figNo: 'DG-01', date: '2026.08', unit: '（填写）',
  paper: 'a3', density: 1, source: '蓄水池', pump: '离心/自吸泵', filter: '叠片式',
  suctionDN: 80, mainDN: 90, checkValve: true, airValve: true,
  fertCount: 1, ferts: [{ type: '文丘里', dn: 25 }],
  show: { num: true, dn: true, legend: true, table: true, notes: true, sign: true },
  layoutVer: 2,
  tableX: null, tableY: null, tableW: null, tableH: null,
  notesX: null, notesY: null, notesW: null, notesH: null
};
var DN_OPT = [50, 63, 75, 80, 90, 100, 110, 125, 150];
var FDN_OPT = [16, 20, 25, 32, 40];
var cfg = null;
var saved = null;
var ZONE_GAP = 8;   // 设备表与设计说明区域横向间距（mm），恒定不变（移动/缩放联动保持）
try { saved = JSON.parse(localStorage.getItem('drip-cfg-l2')); } catch (e) {}
/* 布局 v2：区域对齐关系变更（设备表左缘=图例左缘、设计说明顶端=设备表顶端、间距缩小）。
   旧版保存的位置/尺寸已不适用，自动丢弃 8 个位置字段，恢复新默认布局 */
if (saved && saved.layoutVer !== 2) {
  saved.tableX = null; saved.tableY = null; saved.tableW = null; saved.tableH = null;
  saved.notesX = null; saved.notesY = null; saved.notesW = null; saved.notesH = null;
}
cfg = mergeDeep(clone(DEFAULTS), saved || {});
if (!cfg.ferts || !cfg.ferts.length) cfg.ferts = [{ type: '文丘里', dn: 25 }];
cfg.fertCount = Math.min(4, Math.max(1, cfg.fertCount || 1));

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function mergeDeep(a, b) {
  if (!b) return a;
  for (var k in b) {
    if (typeof b[k] === 'object' && b[k] && !Array.isArray(b[k]) && typeof a[k] === 'object' && a[k]) {
      a[k] = mergeDeep(a[k], b[k]);

  document.getElementById('cfg_mainDN').value = cfg.mainDN;
  document.getElementById('cfg_title').value = cfg.title;
  document.getElementById('cfg_figNo').value = cfg.figNo;
  document.getElementById('cfg_date').value = cfg.date;
  document.getElementById('cfg_unit').value = cfg.unit;

function renderFertList() {
  var box = document.getElementById('fertList');
  var n = cfg.fertCount;
  while (cfg.ferts.length < n) cfg.ferts.push({ type: '文丘里', dn: 25 });
  cfg.ferts = cfg.ferts.slice(0, n);
  var html = '';
  for (var i = 0; i < n; i++) {
    html += '<div class="fert-item"><div class="ft">第 ' + (i + 1) + ' 路吸肥管（图面编号 4-' + (i + 1) + '）</div>' +
      '<div class="row"><label>施肥方式</label><select data-i="' + i + '" data-f="type">' +
      ['文丘里','压差式','注肥泵'].map(function (t) { return '<option' + (cfg.ferts[i].type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="row"><label>吸肥管 DN</label><select data-i="' + i + '" data-f="dn">' +
      FDN_OPT.map(function (d) { return '<option value="' + d + '"' + (cfg.ferts[i].dn === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') +
      '</select></div></div>';
  }
  box.innerHTML = html;
  box.querySelectorAll('select[data-f]').forEach(function (s) {
    s.addEventListener('change', function () {
      var i = +s.getAttribute('data-i'), f = s.getAttribute('data-f');
      cfg.ferts[i][f] = (f === 'dn') ? +s.value : s.value;
      persist(); render();

function collect() {
  cfg.title = document.getElementById('cfg_title').value.trim() || DEFAULTS.title;
  cfg.figNo = document.getElementById('cfg_figNo').value.trim() || 'DG-01';
  cfg.date = document.getElementById('cfg_date').value.trim();
  cfg.unit = document.getElementById('cfg_unit').value.trim() || '（填写）';
  cfg.paper = document.getElementById('cfg_paper').value;
  cfg.density = parseFloat(document.getElementById('cfg_density').value) || 1;
  cfg.source = document.getElementById('cfg_source').value;
  cfg.pump = document.getElementById('cfg_pump').value;
  cfg.filter = document.getElementById('cfg_filter').value;
  var _sdv = +document.getElementById('cfg_suctionDN').value;
  var _mdv = +document.getElementById('cfg_mainDN').value;
  if (isFinite(_sdv) && _sdv >= 25) cfg.suctionDN = Math.round(_sdv);
  if (isFinite(_mdv) && _mdv >= 25) cfg.mainDN = Math.round(_mdv);
  cfg.checkValve = document.getElementById('cfg_checkValve').checked;
  cfg.airValve = document.getElementById('cfg_airValve').checked;
  cfg.fertCount = +document.getElementById('cfg_fertCount').value;
  document.querySelectorAll('#cfg_show input').forEach(function (b) { cfg.show[b.getAttribute('data-k')] = b.checked; });
  while (cfg.ferts.length < cfg.fertCount) cfg.ferts.push({ type: '文丘里', dn: 25 });
  cfg.ferts = cfg.ferts.slice(0, cfg.fertCount);
}
function persist() { try { localStorage.setItem('drip-cfg-l2', JSON.stringify(cfg)); } catch (e) {} }
function loadDefault() { cfg = clone(DEFAULTS); bindUI(); persist(); render(); }

document.addEventListener('change', function (e) {
  if (e.target.closest('#fertList')) return;
  if (e.target.id && e.target.id.indexOf('cfg_') === 0) { collect(); if (e.target.id === 'cfg_fertCount') renderFertList(); persist(); render(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id && e.target.id.indexOf('cfg_') === 0) { collect(); persist(); render(); }
});

/* 布局计算：全部横向段长与密度 k、图纸尺寸一致，供 drawSVG 与 render 共用 */
function layout(cfg) {
  var k = cfg.density;
  var fW = 92 * k, fH = 58 * k;
  var fGap = Math.min(fW + 18 * k, 96 + 24 * k);   // 吸肥管盒子间距 ≥ 盒宽，杜绝重叠
  var x = 60 * k + (96 * k + 26 * k) + (26 * k + 26 * k + 20 * k);   // 水源 + 底阀吸水管
  x += (cfg.fertCount - 1) * fGap + fW + 30 * k;  // 吸肥区
  x += (34 + 20) * k;                              // 闸阀
  x += (22 + 34 + 27 + 16) * k;                    // 水泵
  x += 40 * k;                                     // 压力表
  x += (10 + 30 + 14) * k;                         // 止回阀
  x += (14 + 96 + 16) * k;                         // 过滤器
  x += 40 * k;                                     // 压力表（过滤器后）
  x += 340;                                        // 主管保留段（弯折前水平段，拉长使主图横向铺满 A3 绘图区）
  return { k: k, fW: fW, fH: fH, fGap: fGap, xEnd: x };
}
/* SVG 尺寸：W/H 与纸张绘图区宽高比匹配（A3 满布），render/exportSVG/exportPNG 三处共用，避免不一致 */
function svgSize(cfg) {
  var L = layout(cfg);
  var W = Math.ceil(L.xEnd + 60);
  var ly = 255 + 52 * L.k + 40;                   // 图例区起始 y
  var H = Math.ceil(ly + (cfg.show.legend ? 134 : 40));   // 底部留白 20（注记下方）
  return { W: W, H: H, L: L, ly: ly };
}
function pw(dn) { return 2 + (dn / 25) * 0.8; }
function drawSVG(cfg, W, H) {
  var L = layout(cfg), k = L.k;
  var yMain = 255;
  var g = [];
  g.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">');
  g.push('<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>');

          g.push('<line x1="' + cx + '" y1="' + (cy - 17) + '" x2="' + (cx + 4) + '" y2="' + (cy - 21) + '" stroke="' + blue + '" stroke-width="1.2"/>');
        }

          g.push('<line x1="' + (cx - 14) + '" y1="' + cy + '" x2="' + (cx + 14) + '" y2="' + cy + '" stroke="' + blue + '" stroke-width="1.6" marker-end="url(#arrow)"/>');

      }
    ];

    for (var li = 0; li < legendItems.length; li++) {
      var lcol = li % lgCols, lrow = Math.floor(li / lgCols);
      var lx = 40 + lcol * lgColW + 22;        // 图标中心 x（列起点 + 缩进）
      var lyy = lgY + lrow * lgRowGap;         // 图标中心 y
      legendItems[li].draw(lx, lyy);
      txt(lx + 32, lyy + 4, legendItems[li].name, 12, '#333', 'start');

    var noteY = lgY + Math.ceil(legendItems.length / lgCols) * lgRowGap + 12;
    txt(40, noteY, '注：管径为参考值，最终以水力计算确定；吸肥管接于水泵进水侧（吸水管）。', 11.5, '#555', 'start');
  }

  g.push('</svg>');
  return g.join('');
}
/* ===== 主渲染：组装整张图纸 ===== */
function render() {
  collect();
  var S = svgSize(cfg), L = S.L, W = S.W, H = S.H;

  var paperW, paperH;
  if (cfg.paper === 'a4') { paperW = 297; paperH = 210; }
  else { paperW = 420; paperH = 297; }

  var sheet = document.getElementById('sheet');
  sheet.className = 'sheet print-area ' + cfg.paper;
  sheet.style.width = paperW + 'mm';
  sheet.style.height = paperH + 'mm';

  /* 同步 @page 打印尺寸，保证打印/转 PDF 时图纸满布整页（横向） */
  var pageStyle = document.getElementById('print-page');
  if (!pageStyle) {
    pageStyle = document.createElement('style');
    pageStyle.id = 'print-page';
    document.head.appendChild(pageStyle);
  }
  pageStyle.textContent = '@page { size: ' + paperW + 'mm ' + paperH + 'mm; margin: 0; }';

  /* 布局参数（mm） */
  var headTop = 11, headH = 14;
  var svgTop = headTop + headH + 3;          // 28mm
  var signH = cfg.show.sign ? 17 : 0;
  var signBottom = 10;
  var lowerH = (cfg.show.table || cfg.show.notes) ? (cfg.paper === 'a4' ? 78 : 82) : 0;
  var lowerGap = 6;
  var svgBottom = signH + signBottom + lowerH + (lowerH > 0 ? lowerGap : 0) + 4;

  /* 设备表与上方图例左侧对齐：按 .svg-zone 居中换算 SVG 内 x=40（图例标题）在纸面的位置 */
  var svgZoneH = paperH - svgTop - svgBottom;
  var svgScale = svgZoneH / H;
  var svgLeft = 13 + (paperW - 26 - W * svgScale) / 2;   // .svg-zone left/right=13mm，SVG 居中
  var legendLeft = svgLeft + 40 * svgScale;              // 图例标题"图例"左边缘
  var tabPad = Math.max(legendLeft - 11, 2);             // 设备表默认左缘偏移（11 + tabPad = 图例标题"图例"左缘）

  var html = '';
  html += '<div class="sheet-inner"></div>';
  html += '<div class="sheet-inner2"></div>';
  html += '<div class="head"><span class="proj">' + esc(cfg.title) + '</span>';
  html += '<span class="sub">' + esc(cfg.unit) + '</span>';
  html += '<span class="code">' + esc(cfg.figNo) + '</span></div>';
  html += '<div class="svg-zone" style="top:' + svgTop + 'mm;bottom:' + svgBottom + 'mm;">' + drawSVG(cfg, W, H) + '</div>';

  if (lowerH > 0) {
    var lowerW = paperW - 11 - 13;                                  // 底部可用宽（左 11mm / 右 13mm）
    var zoneTop = paperH - (signH + signBottom + lowerGap) - lowerH; // 底部区域顶边（mm）
    var defTableW = Math.max(90, lowerW * 0.60);
    var defNotesW = Math.max(60, lowerW - defTableW - ZONE_GAP);
    var defZoneH = lowerH - 6;
    /* 设备表左缘与图例标题对齐；tX/tW 提前计算，供设计说明恒定间距引用 */
    var tX = (cfg.tableX != null) ? cfg.tableX : 11 + tabPad;
    var tW = (cfg.tableW != null) ? cfg.tableW : defTableW;
    if (cfg.show.table) {
      var tY = (cfg.tableY != null) ? cfg.tableY : zoneTop + 3;
      var tH = (cfg.tableH != null) ? cfg.tableH : defZoneH;
      html += zbBlock('设备表', 'table', buildTable(), tX, tY, tW, tH);
    }
    if (cfg.show.notes) {
      /* 横向间距恒定：设计说明左缘 = 设备表右缘 + ZONE_GAP（忽略 cfg.notesX） */
      var nX = tX + tW + ZONE_GAP;
      var nY = (cfg.notesY != null) ? cfg.notesY : zoneTop + 3;
      var nW = (cfg.notesW != null) ? cfg.notesW : defNotesW;
      var nH = (cfg.notesH != null) ? cfg.notesH : defZoneH;
      html += zbBlock('设计说明', 'notes', buildNotes(), nX, nY, nW, nH);
    }
  }

  if (cfg.show.sign) {
    html += buildSign();
  }

  sheet.innerHTML = html;
  initZoneBlocks();
}

/* ===== 设备表 ===== */
function buildTable() {
  var rows = [];
  rows.push(['1', '水源', cfg.source, '座', '1', '蓄水/取水设施']);
  rows.push(['2', '底阀+滤网', 'DN' + cfg.suctionDN + ' 铸铁/不锈钢', '套', '1', '吸水口防杂物']);
  rows.push(['3', '吸水管', 'DN' + cfg.suctionDN + ' PE/PVC', 'm', '\u2014', '流速 \u2264 1.5 m/s']);
  for (var i = 0; i < cfg.fertCount; i++) {
    var f = cfg.ferts[i];
    rows.push(['4-' + (i + 1), '施肥器', f.type + ' DN' + f.dn, '套', '1', '含施肥罐']);
  }
  rows.push(['5', '闸阀', 'DN' + cfg.suctionDN, '个', '1', '泵前检修用']);
  rows.push(['6', '水泵', cfg.pump + '（Q、H 按计算）', '台', '1', '配电机与控制柜']);
  rows.push(['7', '压力表', '0~1.0 MPa', '块', '1', '过滤器前监测']);
  if (cfg.checkValve) rows.push(['8', '止回阀', 'DN' + cfg.suctionDN, '个', '1', '防肥液/水回流']);
  rows.push(['9', '过滤器', cfg.filter + ' DN' + cfg.suctionDN, '套', '1', '按水源水质选型']);
  rows.push(['10', '压力表', '0~1.0 MPa', '块', '1', '过滤器后监测']);
  rows.push(['11', '供水主管', 'DN' + cfg.mainDN + ' PE/PVC', 'm', '\u2014', '至各轮灌区']);
  if (cfg.airValve) rows.push(['12', '排气阀', 'DN25', '个', '1', '主管首端高点']);

  var h = '<table><thead><tr>' +
    '<th style="width:8%">编号</th>' +
    '<th class="l" style="width:22%">名称</th>' +
    '<th style="width:22%">规格/型号</th>' +
    '<th style="width:8%">单位</th>' +
    '<th style="width:8%">数量</th>' +
    '<th class="l" style="width:32%">备注</th>' +
    '</tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr><td>' + r[0] + '</td><td class="l">' + r[1] + '</td><td>' + r[2] +
      '</td><td>' + r[3] + '</td><td>' + r[4] + '</td><td class="l">' + r[5] + '</td></tr>';
  });
  h += '</tbody></table>';
  return h;
}

  /* 图纸内虚线外框区域：zbBlock 生成 + initZoneBlocks 拖拽（移动/缩放，文字字号不变；双击标题恢复默认）。
     设备表与设计说明默认对齐：设备表左缘=图例左缘（11+tabPad），设计说明顶端=设备表顶端（同 top），水平间距 zoneGap=3mm */
  function zbBlock(title, cls, body, x, y, w, h) {
    return '<div class="zb-block zb-' + cls + '" style="left:' + x.toFixed(1) + 'mm;top:' + y.toFixed(1) + 'mm;width:' + w.toFixed(1) + 'mm;height:' + h.toFixed(1) + 'mm;">' +
      '<i class="zb-frame"></i>' +
      '<div class="zb-title" title="拖动移动位置，双击恢复默认">' + title + '</div>' +
      '<div class="zb-body">' + body + '</div>' +
      '<i class="zb-handle" title="拖动调整大小（文字不变）"></i>' +
      '</div>';
  }
function initZoneBlocks() {
  var sheet = document.getElementById('sheet');
  var blocks = sheet.querySelectorAll('.zb-block');
  var paperW = (cfg.paper === 'a4' ? 297 : 420);
  var paperH = (cfg.paper === 'a4' ? 210 : 297);
  function pxPerMm() {
    var rect = sheet.getBoundingClientRect();
    return rect.width > 0 ? rect.width / paperW : 3.78;
  }
  function readPos(blk) {
    var rect = blk.getBoundingClientRect();
    var srect = sheet.getBoundingClientRect();
    var p = pxPerMm();
    return {
      x: rect.width > 0 ? (rect.left - srect.left) / p : (parseFloat(blk.style.left) || 0),
      y: rect.height > 0 ? (rect.top - srect.top) / p : (parseFloat(blk.style.top) || 0),
      w: rect.width > 0 ? rect.width / p : (parseFloat(blk.style.width) || 62 * paperW / 100),
      h: rect.height > 0 ? rect.height / p : (parseFloat(blk.style.height) || 60)
    };
  }
  /* 保存所有虚线框的位置与尺寸（移动/缩放任一框后整体落库） */
  function saveAll() {
    blocks.forEach(function (b) {
      var k = b.className.indexOf('zb-table') >= 0 ? 'table' : 'notes';
      var r = readPos(b);
      cfg[k + 'X'] = Math.round(r.x * 10) / 10;
      cfg[k + 'Y'] = Math.round(r.y * 10) / 10;
      cfg[k + 'W'] = Math.round(r.w * 10) / 10;
      cfg[k + 'H'] = Math.round(r.h * 10) / 10;
    });
    persist();
  }
  blocks.forEach(function (blk) {
    var key = blk.className.indexOf('zb-table') >= 0 ? 'table' : 'notes';
    var title = blk.querySelector('.zb-title');
    var handle = blk.querySelector('.zb-handle');
    title.addEventListener('mousedown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var p = pxPerMm();
      var pos0 = [];
      blocks.forEach(function (b) { pos0.push(readPos(b)); });
      var idx = Array.prototype.indexOf.call(blocks, blk);
      var s = pos0[idx];
      var sx = e.clientX, sy = e.clientY;
      var oldUS = document.body.style.userSelect;
      document.body.style.userSelect = 'none';
      function move(ev) {
        /* 以被拖动框为基准做边界钳制，然后所有框整体同步平移（保持顶端对齐与间距） */
        var nx = Math.max(11, Math.min(paperW - 11 - s.w, s.x + (ev.clientX - sx) / p));
        var ny = Math.max(28, Math.min(paperH - 11 - s.h, s.y + (ev.clientY - sy) / p));
        var odx = nx - s.x, ody = ny - s.y;
        blocks.forEach(function (b, i) {
          b.style.left = (pos0[i].x + odx).toFixed(1) + 'mm';
          b.style.top = (pos0[i].y + ody).toFixed(1) + 'mm';
        });
      }
      function up() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.userSelect = oldUS;
        saveAll();
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    handle.addEventListener('mousedown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var p = pxPerMm();
      var s = readPos(blk);
      /* 找出另一框：缩放设备表时设计说明跟随（保持横向间距 ZONE_GAP 恒定） */
      var otherBlk = null, other = null;
      blocks.forEach(function (b) {
        if (b !== blk) { otherBlk = b; other = readPos(b); }
      });
      var isLeft = otherBlk !== null && blk.className.indexOf('zb-table') >= 0;
      var sx = e.clientX, sy = e.clientY;
      var oldUS = document.body.style.userSelect;
      document.body.style.userSelect = 'none';
      function move(ev) {
        var maxW = paperW - 13 - s.x;
        if (isLeft && other) {
          /* 设计说明右缘不得超过图纸右缘 → 设备表最大宽度受限 */
          maxW = Math.min(maxW, paperW - 13 - s.x - ZONE_GAP - other.w);
        }
        var nw = Math.max(80, Math.min(maxW, s.w + (ev.clientX - sx) / p));
        var nh = Math.max(42, Math.min(paperH - 10 - s.y, s.h + (ev.clientY - sy) / p));
        blk.style.width = nw.toFixed(1) + 'mm';
        blk.style.height = nh.toFixed(1) + 'mm';
        if (isLeft && other) otherBlk.style.left = (s.x + nw + ZONE_GAP).toFixed(1) + 'mm';
      }
      function up() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.userSelect = oldUS;
        saveAll();
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    title.addEventListener('dblclick', function () {
      cfg.tableX = null; cfg.tableY = null;
      cfg.tableW = null; cfg.tableH = null;
      cfg.notesX = null; cfg.notesY = null;
      cfg.notesW = null; cfg.notesH = null;
      persist();
      render();
    });
  });
}

/* ===== 设计说明（详细版） ===== */
function buildNotes() {
  var notes = [
    '<b>系统组成与流程：</b>水源（蓄水池）→ 底阀+滤网 → 吸水管 →（吸肥管/施肥器接入）→ 水泵 → 过滤器 → 供水主管 → 各轮灌区（滴灌带/滴头）。本图范围为水源至供水主管段，主干分支与田间管网另图绘制。',
    '<b>流量与管径确定：</b>设计流量 Q = 灌溉面积 × 设计灌水率（或毛灌水定额 ÷ 轮灌周期 ÷ 日运行时间）。吸水管、主管流速取 1.0~1.5 m/s，管径 d = 1000×√(4Q/πv)。示例：Q≈20 m³/h 时吸水管 DN100、供水主管 DN90；Q 每增加一倍升一级管径。',
    '<b>水泵选型：</b>流量按系统最大设计流量的 1.1 倍取；扬程 H = 净扬程 + 管路沿程/局部损失 + 过滤器损失（约 5~8 m）+ 灌水器工作压力（滴头 10~15 m）。自吸泵吸程一般 ≤ 5~6 m，水位落差超出时应改用离心泵配底阀灌水或潜水泵。',
    '<b>过滤器选型：</b>水源为塘/河水（含泥沙、藻类、悬浮物）时，建议砂石过滤器 + 叠片过滤器二级过滤；井水、清水可用叠片式或网式。过滤精度 100~130 目，出口压损 ≤ 7 m；过滤器前后设压力表，压差 &gt; 0.05 MPa 时及时反冲洗。',
    '<b>吸肥装置：</b>本图按吸肥管接于吸水管（泵前）布置，配置施肥罐与调节阀，利用泵前负压吸入肥液；亦可采用泵后旁路文丘里施肥器方案。施肥浓度控制 0.1%~0.3%，施肥完毕用清水冲洗管路 10~15 min，防止肥液结晶堵塞灌水器。',
    '<b>附属设施：</b>泵前设闸阀与底阀保证灌水；泵后设止回阀防止回流污染水源；主管首端高点设排气阀，末端设冲洗阀；冬季或停用期排空管路存水防冻。'
  ];
  var h = '<ul class="notes" style="list-style:none;padding:0;margin:0;">';
  notes.forEach(function (n, i) {
    h += '<li>' + (i + 1) + '. ' + n + '</li>';
  });
  h += '</ul>';
  return h;
}

/* ===== 图签 ===== */
function buildSign() {
  return '<table class="sign"><tr>' +
    '<td class="cap">设计</td><td class="cap">校核</td><td class="cap">审核</td><td class="cap">日期</td></tr>' +
    '<tr><td class="name">&nbsp;</td><td class="name">&nbsp;</td><td class="name">&nbsp;</td>' +
    '<td class="name">' + esc(cfg.date) + '</td></tr></table>';
}

/* ===== 导出 SVG ===== */
function exportSVG() {
  collect();
  var S = svgSize(cfg), W = S.W, H = S.H;
  var svg = drawSVG(cfg, W, H);
  var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cfg.figNo + '_滴灌供水设计图.svg';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

/* ===== 导出 PNG ===== */
function exportPNG() {
  collect();
  var S = svgSize(cfg), W = S.W, H = S.H;
  var svg = drawSVG(cfg, W, H);
  var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function () {
    var scale = 2;
    var canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = cfg.figNo + '_滴灌供水设计图.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.onerror = function () {
    URL.revokeObjectURL(url);
    alert('PNG 导出失败，请尝试导出 SVG。');
  };
  img.src = url;
}

/* ===== URL 参数联动（润野方案计算结果：q=流量 h=扬程 p=功率 main=供水主管 suc=吸水管）===== */
(function () {
  function qp(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function nearest(v, arr) {
    var best = arr[0];
    for (var i = 0; i < arr.length; i++) { if (Math.abs(arr[i] - v) < Math.abs(best - v)) best = arr[i]; }
    return best;
  }
  var q = qp('q'), h = qp('h'), p = qp('p');
  var main = qp('main'), suc = qp('suc');
  if (q || h || p) {
    var parts = ['润野灌溉 — 供水首部系统图'];
    if (q) parts.push('Q ' + q);
    if (h) parts.push('H ' + h);
    if (p) parts.push('P ' + p);
    cfg.title = parts.join(' · ');
  }
  var md = parseInt(main, 10), sd = parseInt(suc, 10);
  if (md) cfg.mainDN = nearest(md, DN_OPT);     // 润野方案「主管」→ 供水主管
  if (sd) cfg.suctionDN = nearest(sd, DN_OPT);  // 润野方案「支管」→ 吸水管
  if (md || sd) persist();
})();

/* ===== 初始化 ===== */
bindUI();
render();

<script>
/* ===== 前端防护：禁用右键菜单与源码查看快捷键 ===== */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(e.ctrlKey&&k==='u')){
      e.preventDefault();e.stopPropagation();return false;
    }
  });
  document.addEventListener('selectstart',function(e){
    var t=e.target&&e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA')return;
    e.preventDefault();
  });
})();
</script>

<script>
(function(){
  var b=document.getElementById('mobileMenuBtn');
  var n=document.getElementById('mainNav');
  if(b&&n){b.addEventListener('click',function(){n.classList.toggle('open');});}
})();
</script>
